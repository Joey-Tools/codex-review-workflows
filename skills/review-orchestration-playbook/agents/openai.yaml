interface:
  display_name: "Review Orchestration Playbook"
  short_description: "Run fresh Codex single, actual-Claude double, or GitHub triple."
  default_prompt: "Use $review-orchestration-playbook as the only review entrypoint. Resolve the local frozen range and PR selector independently. Preserve an explicit base_sha..head_sha for local lanes; independently select an explicitly named PR or exactly one authenticated open PR for the exact current head repo/branch when PR-specific or triple work is requested. Explicit-range-only single/double needs no PR probe. For every selected PR, read authenticated baseRefName/baseRefOid/headRefOid, require locally complete endpoint commits and exactly one git merge-base, and require base_sha == pr_merge_base and head_sha == pr_head_oid before counting PR-specific readiness or triple coverage. A same-head/different-base range is blocked-input scope-mismatch and must not be rewritten or described as whole-PR coverage. Multiple required PR candidates or a proven no-PR path without explicit range/target are blocked-input; triple with detached/unknown branch and no explicit PR is blocked-input/triple-inconclusive, not effective double. A report-only request never authorizes an anchor commit; intended dirty/untracked state without a representing committed range is blocked-authorization. Single is exactly one read-only Codex reviewer agent launched with fork_turns=none in its own clean Git worktree; give it control metadata and refs, not a prebuilt full diff, and let it load applicable guidance and inspect the range with bounded Git/tools. Double adds an actual Claude Code process launched directly in another independent read-only worktree; capture raw stdout outside that worktree and require validate_claude_stream.py classification accepted before findings count; isolated_review and Copilot never count. Triple adds exact @codex review plus a trustworthy terminal current-head GitHub Codex result only on exact host github.com; every other host and operating identity hoteng or hoteng_cisco is unsupported. Accept provider review/comment evidence only from exact chatgpt-codex-connector[bot] with REST type Bot, and app/check evidence only from exact app slug chatgpt-codex-connector. For one unchanged head, re-read complete authenticated request history immediately before posting and accepting; at most one accepted exact request may exist, never post a second, and an older request that might overlap the candidate artifact makes the lane triple-inconclusive. Accept a terminal artifact only after isolating it to the one current request; for checks, both non-null `started_at` and `completed_at` must be strictly later than that request's server `created_at`. Timestamps prove ordering, not request/run lineage. No PR or proved integration/host/identity/service unavailability means effective double. An existing supported PR/head mismatch without separate mutation authorization means requested triple, effective triple-inconclusive, and GitHub lane blocked-authorization. Missing response, unknown provider identity, or generic failure means triple-inconclusive; malformed, stale, ambiguous, or incomplete evidence after service start means triple-inconclusive. Do not add retired extra Codex gates."
