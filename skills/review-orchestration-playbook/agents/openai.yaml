interface:
  display_name: "Review Orchestration Playbook"
  short_description: "Run fresh Codex single, actual-Claude double, or GitHub triple."
  default_prompt: "Use $review-orchestration-playbook as the only review entrypoint. Freeze base_sha..head_sha. Select scope by explicit frozen range, otherwise explicit PR, otherwise exactly one authenticated open PR for the exact current head repo/branch; multiple candidates or a proven no-PR path without explicit range/target are blocked-input. A report-only request never authorizes an anchor commit; intended dirty/untracked state without a representing committed range is blocked-authorization. Single is exactly one read-only Codex reviewer agent launched with fork_turns=none in its own clean Git worktree; give it control metadata and refs, not a prebuilt full diff, and let it load applicable guidance and inspect the range with bounded Git/tools. Double adds an actual Claude Code process launched directly in another independent read-only worktree; capture raw stdout outside that worktree and require validate_claude_stream.py classification accepted before findings count; isolated_review and Copilot never count. Triple adds exact @codex review plus a trustworthy terminal current-head GitHub Codex result only on exact host github.com; every other host and operating identity hoteng or hoteng_cisco is unsupported. Accept provider review/comment evidence only from exact chatgpt-codex-connector[bot] with REST type Bot, and app/check evidence only from exact app slug chatgpt-codex-connector. No PR or proved integration/host/identity/service unavailability means effective double. An existing supported PR/head mismatch without separate mutation authorization means requested triple, effective triple-inconclusive, and GitHub lane blocked-authorization. Missing response, unknown provider identity, or generic failure means triple-inconclusive; malformed, stale, ambiguous, or incomplete evidence after service start means triple-inconclusive. Do not add retired extra Codex gates."
