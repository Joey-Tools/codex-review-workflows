interface:
  display_name: "Review Orchestration Playbook"
  short_description: "Run fresh Codex single, actual-Claude double, or GitHub triple."
  default_prompt: "Use $review-orchestration-playbook as the only review entrypoint. Freeze base_sha..head_sha. Single is exactly one read-only Codex reviewer agent launched with fork_turns=none in its own clean Git worktree; give it control metadata and refs, not a prebuilt full diff, and let it load applicable guidance and inspect the range with bounded Git/tools. A report-only request never authorizes an anchor commit; without an existing committed range, stop as blocked-authorization. Double adds an actual Claude Code process launched directly in another independent read-only worktree; isolated_review and Copilot never count. Triple adds a trustworthy terminal current-head GitHub Codex result on a supported GitHub Cloud PR, normally requested with exact @codex review. No PR or proved integration/host/identity/service unavailability means effective double. An existing supported PR/head mismatch without separate mutation authorization means requested triple, effective triple-inconclusive, and GitHub lane blocked-authorization. Missing response or generic failure means triple-inconclusive; malformed, stale, ambiguous, or incomplete evidence after service start means triple-inconclusive. Do not add retired extra Codex gates."
