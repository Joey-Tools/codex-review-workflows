interface:
  display_name: "Review Orchestration Playbook"
  short_description: "Run fresh Codex single, actual-Claude double, or GitHub triple."
  default_prompt: >-
    Use $review-orchestration-playbook as the only review entrypoint.
    Resolve the local frozen range and PR selector independently.
    Preserve an explicit base_sha..head_sha for local lanes; independently select an explicitly named PR or exactly one authenticated open PR for the exact current head repo/branch when PR-specific or triple work is requested.
    Explicit-range-only single/double needs no PR probe.
    For every selected PR, including an explicitly named one, require authenticated state=open, merged=false, and merged_at=null; missing or contradictory lifecycle evidence is blocked-input pr-lifecycle-unverified, closed-unmerged is selected-pr-closed, merged is terminal already-merged/selected-pr-merged, and an observed non-open lifecycle at any mandated post-start snapshot is triple-inconclusive.
    Revalidate lifecycle at selection, before posting, before accepting a result, and before readiness/merge; those point-in-time snapshots do not prove that no intermediate close-and-reopen occurred.
    Then read authenticated baseRefName/baseRefOid/headRefOid, require locally complete endpoint commits and exactly one git merge-base, and require base_sha == pr_merge_base and head_sha == pr_head_oid before counting PR-specific readiness or triple coverage.
    A same-head/different-base range is blocked-input scope-mismatch and must not be rewritten or described as whole-PR coverage.
    Multiple required PR candidates or a proven no-PR path without explicit range/target are blocked-input; triple with detached/unknown branch and no explicit PR is blocked-input/triple-inconclusive, not effective double.
    A report-only request never authorizes an anchor commit; intended dirty/untracked state without a representing committed range is blocked-authorization.
    Single is exactly one read-only Codex reviewer agent launched with fork_turns=none in its own trusted-guard-materialized clean Git worktree; give it control metadata and refs, not a prebuilt full diff, and let it load applicable guidance and inspect the range with bounded Git/tools.
    Double adds an actual Claude Code process launched directly in another independent read-only worktree; capture raw stdout outside that worktree and require the manifest-bound named_lane_guard validate-claude-stream profile to return classification accepted before findings count; isolated_review and Copilot never count.
    Both Claude paths accept only publisher-verified strict stable >=2.1.211,<3.0.0, bind the selected release to its exact signed manifest/platform size/SHA, and require credential-free --version plus --help capability probes from one verified snapshot before credentials or review input.
    The named-direct lane accepts only ordinary local login in real HOME and exposes no API-key or OAuth-token interface.
    The low-level helper selects authentication with precedence ANTHROPIC_API_KEY > CLAUDE_CODE_OAUTH_TOKEN > local login and opaque-forwards only the winning explicit value; helper local login uses its private credential carrier/broker and guarded writeback, while helper API-key/OAuth modes bypass that transaction.
    Validate the exact preflight version/source with the closed legacy or extended structural init/intermediate/terminal profile plus any exact-version overlay.
    Before GitHub-lane work, read references/github-codex-evidence-authority.md and use its complete authenticated current-scope provider snapshot.
    Record request_policy, provider_profile, and evidence_basis separately.
    Wait for the fresh Codex and actual Claude lanes to have terminal artifacts, post at most one exact @codex review request for an unchanged head, and never post a second or third request.
    Reuse existing evidence and do not post a repair request.
    Record early-request-observed for an early request and duplicate-observed when more than one same-scope request exists, including an overlapping or pending extra request; those warnings are outcome-neutral.
    A lone compliant pending request is not a warning and means the provider outcome remains pending unless a trustworthy terminal artifact already exists.
    Provider-evidence evaluation does not require request/run attribution.
    Triple then requires accepted current-head GitHub Codex evidence only on exact host github.com; every other host and operating identity hoteng or hoteng_cisco is unsupported.
    The terminal-payload profile requires a complete terminal provider-authored current-head findings payload from exact chatgpt-codex-connector[bot] with REST type Bot.
    Fetch the selected review body plus every fully paginated associated inline review comment, or the complete terminal issue-comment body, and include relevant thread state in the final re-read.
    For proved pre-provider ineligibility or blockers, record provider_profile: null and evidence_basis: null. Otherwise classify provider_profile as terminal-payload, mixed, thumbs-up-clean, or unknown.
    In mixed, any trustworthy current-scope terminal payload takes precedence over every reaction; among terminal payloads, select the latest trustworthy artifact, and never accept reaction-only clean.
    Only thumbs-up-clean can reach the authority's complete weak +1 fallback; eyes is liveness-only.
    Missing terminal evidence or an unestablished reaction-only profile remains pending while bounded waiting is meaningful; after the wait is exhausted, ambiguous scope, payload, pagination, profile, or final re-read means triple-inconclusive.
    A post-request base-only retarget invalidates whole-PR evidence but cannot authorize a replacement same-head request: report blocked-input base-changed-same-head and effective triple-inconclusive until a separately authorized ordinary change creates a new head; never manufacture an empty or anchor commit.
    An exact app-slug chatgpt-codex-connector current-head check/run whose non-null started_at is strictly later than the request proves service start only; it never completes triple or proves clean/no-findings even when completed/success.
    A same-App check may be unrelated and success may coexist with review findings.
    No PR or proved integration/host/identity/service unavailability means effective double. The fixed authority baseline has no accepted provider body grammar for a no-start rejection, so free-form exact-bot prose cannot currently prove this fallback.
    An existing supported PR/head mismatch without separate mutation authorization means requested triple, effective triple-inconclusive, and GitHub lane blocked-authorization.
    A missing response, otherwise valid nonterminal/check-only evidence, or a retryable transport/read failure remains pending while bounded waiting is meaningful; after exhaustion, it is triple-inconclusive. Unknown provider identity, malformed/stale evidence, a non-retryable failure, or an unstable final read is immediately triple-inconclusive.
    Do not add retired extra Codex gates.
