interface:
  display_name: "Review Orchestration Playbook"
  short_description: "Run fresh Codex single, actual-Claude double, or GitHub triple."
  default_prompt: >-
    Use $review-orchestration-playbook as the only named-review and PR-readiness entrypoint.
    Load SKILL.md first. For GitHub Codex work, load references/github-codex-evidence-authority.md, then its linked epoch machine; load the retarget machine only for a same-head base-only retarget, and load github-pr-probes.md or pr-readiness.md only when their endpoint or delivery role is needed.
    Preserve an explicit caller base_sha..head_sha independently from PR selection. Explicit-range-only single or double review requires no PR probe. PR-specific or triple work selects an explicitly named PR or exactly one authenticated open PR for the exact current head repository and branch; multiple candidates, detached ownership, or a proved no-PR result without an explicit committed range or target/base is blocked-input.
    For every selected PR, classify lifecycle before reading scope for lane consumption: require authenticated state=open, merged=false, and merged_at=null. Missing or contradictory lifecycle is pr-lifecycle-unverified; closed-unmerged is selected-pr-closed; merged is already-merged/selected-pr-merged. Revalidate lifecycle before POST, result acceptance, readiness, and merge. A post-start non-open observation is monotonic and later reopen does not repair the lane.
    Only after lifecycle passes, read baseRefName, baseRefOid, and headRefOid, prove locally complete endpoints, derive exactly one pr_merge_base, and compare the selected PR with the preserved range. base_ref_oid and pr_merge_base are separately authenticated and may be equal or different; neither substitutes for the other. Apply the canonical base-only-retarget contract before generic scope-mismatch. Never silently rewrite a caller range or describe mismatched local coverage as whole-PR coverage.
    Single is exactly one fresh-context Codex reviewer in a trusted-guard-materialized independent clean read-only workspace. Double adds an actual Claude Code process in another independent workspace over the same frozen range. Triple adds the eligible GitHub Codex lane on exact github.com. The low-level isolated_review helper and Copilot never count as named lanes.
    For self-policy migration, review control comes from a compatible trusted bundle pinned outside the candidate range; candidate Markdown may be review subject, but candidate-head control code never bootstraps its own certification.
    The named-direct Claude lane uses publisher-verified compatible Claude Code, trusted real HOME, and ordinary local login only. The low-level helper has a separate supplied-diff contract and may select explicit API key, OAuth token, or helper-managed local login; never project helper credential or broker guarantees onto the named-direct lane.
    One GitHub lane is one immutable review epoch. Machine-authorized serial attempts are liveness and audit history, not extra named lanes. Keep at most one active controlled marker, never blind-retry an uncertain POST, and never create an empty or anchor commit to regain eligibility. Request and marker records do not decide the provider result.
    The consumer installs one caller workflow that preserves its repository-owned events, permissions, and concurrency and has exactly one job using JoeyTeng/codex-review-gate-action/.github/workflows/codex-review-gate.yml@v1. Treat floating @v1 as the pre-execution trust boundary. After execution, validate producer receipt v1, producer protocol major 1, decision schema 1, decision policy major 1, and release-provenance v2. Derive exact-attempt W only from receipt job.workflow_sha, receipt action.ref, and the unique exact-attempt referenced_workflows[].sha, with exact ref refs/tags/v1. For every release candidate, independently fetch and locally OpenPGP-verify its provenance-bound immutable release tag object R, derived v1.minor tag object, and historical provenance-v1 tag object T, each directly targeting that candidate's C. Its closed workflow_sha_resolution compares W with only historical T and exact C: zero matches is proved-incompatible only when all other proof is complete, valid, and unambiguous; one is eligible; more than one is malformed ERROR. Independently authenticate and final-stably reread the separate current floating alias T_current -> C_current; it is live audit/stability evidence and never supplies W or validates a historical candidate. If W equals T_current, also require C_current equals C; a valid later alias move may otherwise differ. Classify the complete candidate vector as valid, proved-incompatible, or malformed-or-incomplete-error. A valid signature by a different unambiguous signer or zero W matches may be proved-incompatible only with otherwise complete proof; missing, invalid, ambiguous, or unverifiable tag/signature evidence, multiple W matches, or any integrity/cross-binding contradiction makes the whole admission ERROR. Exclude only proved-incompatible candidates and require exactly one valid release with all three tag proofs and exactly one valid provenance-v2 asset. Never admit v1.5.0 or an erratum path; v1.5.1 is the first admitted release. Retain major-1 policy_version consistency. Independently authenticate source.commit_oid and prove the source packages/action subtree equals the Action-C root tree; this is admission proof, not audit-only and not equality between source commit and C. The consumer pins neither selected called-workflow bytes/digest nor the selected release's external Action SHA set, and the generic Skill pins no patch SHA, tag object, commit, or workflow blob. This proves authenticated run-level consistency, not cryptographic job provenance; rejection cannot undo floating-@v1 code already executed with caller permissions, and the contract provides no online or post-publication revocation guarantee.
    Treat the required-status producer caller as per-PR. An independent repository-owned scheduled dispatcher may perform bounded per-PR transport into it only; the dispatcher is not producer evidence, PASS, or an alternate producer caller, and its exact trigger, cadence, and permissions are not generic protocol or epoch-machine inputs.
    Before provider or required-Action evidence acquisition, load the epoch machine's exact budget configuration and use one parent-owned composed-operation ledger across the complete evidence graph; require every resource_budget to equal it. Counters, retained UTF-8 bytes, and deadline are cumulative, and the body ceiling is per body. No initial/final capture, candidate/sibling evaluation, caller, release, or test input may reset, split, refund, borrow, override, or reseal the ledger. Consume provider evidence artifact-first from complete independently persisted and parsed initial and final inventories. Current-head or parent-proved-ancestor findings and unresolved applicable threads block. Proved nonancestors are excluded; unknown ancestry stays pending only while bounded acquisition can recover and then errors explicitly. A stable carrier-valid current-head clean can supersede only an older same-head or ancestor threadless finding; ancestor-bound clean alone remains pending. Hashless issue clean provides no positive fallback, +1 provides neither PASS nor ACK, and eyes retain only their existing ACK/liveness role and timeouts. Automatic, manual, and controlled artifacts use the same rules. Register provider and status components, then reduce only through one parent-owned sealed composite coordinate binding required-status membership, final provider validation, immutable epoch-origin clock, and current marker/attempt state; caller-composed projections are not authority.
    Report exactly six independent GitHub planes: request_policy; provider, with evidence_basis nested only inside provider; required_action_status; named_github_lane; reaction_audit; and readiness. Never add a seventh top-level plane or collapse them into one GitHub-lane result. PASS means only exact current-head required codex/review-gate=success selected through the sealed canonical reduction. A noncanonical repository-side compatibility publisher or an inferred match on context, head, state, description, or creator is never PASS. PASS alone does not establish completed triple or merge readiness.
    Keep exact lifecycle and scope binding through final reconciliation. A base-only retarget with unchanged head remains blocked because a provider artifact binds head only and cannot prove coverage of the new merge base. At or after 7,200 seconds, any still-budgeted or other incomplete acquisition reduces to overall-timeout FAILURE before late PASS; only with no incomplete acquisition may an actual complete final-stable current-head terminal clean plus canonical status success become PASS, and lateness alone never completes the named lane.
    A report-only named-review request authorizes no mutation except the bare-triple request-comment flow: on an eligible existing PR it may post the scoped @codex review comment and only those serial attempts permitted by the canonical epoch machine. It still does not authorize branch creation, commits, push, PR creation, PR metadata mutation, an anchor commit, fixes, delivery, or merge. Readiness requires canonical current-head Action-status PASS plus all other current-head CI, unresolved-conversation, branch/base, authorization, and final lifecycle gates; it adds no retired review lanes.
    Report requested and effective shape; frozen base_sha and head_sha; selected PR and exact lifecycle/scope when applicable; each local lane status and evidence; all six GitHub planes when applicable; authorization, CI, and conversation status; actionable findings or the exact blocker; and every check actually run. Never claim a gate that was not executed.
