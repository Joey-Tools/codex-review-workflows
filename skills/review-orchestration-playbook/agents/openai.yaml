interface:
  display_name: "Review Orchestration Playbook"
  short_description: "Run fresh Codex single, actual-Claude double, or GitHub triple."
  default_prompt: >-
    Use $review-orchestration-playbook as the only review entrypoint.
    Resolve the local frozen range and PR selector independently.
    Preserve an explicit base_sha..head_sha for local lanes; independently select an explicitly named PR or exactly one authenticated open PR for the exact current head repo/branch when PR-specific or triple work is requested.
    Explicit-range-only single/double needs no PR probe.
    For every selected PR, including an explicitly named one, require authenticated state=open, merged=false, and merged_at=null; missing or contradictory lifecycle evidence is blocked-input pr-lifecycle-unverified, closed-unmerged is selected-pr-closed, merged is terminal already-merged/selected-pr-merged, and an observed non-open lifecycle at any mandated post-start snapshot is triple-inconclusive.
    Revalidate lifecycle at selection, before posting, before accepting a result, and before readiness/merge; those point-in-time snapshots do not prove that no intermediate close-and-reopen occurred.
    Then read authenticated baseRefName/baseRefOid/headRefOid, require locally complete endpoint commits and exactly one git merge-base, and require base_sha == pr_merge_base and head_sha == pr_head_oid before counting PR-specific readiness or triple coverage.
    A same-head/different-base range is blocked-input scope-mismatch and must not be rewritten or described as whole-PR coverage.
    Multiple required PR candidates or a proven no-PR path without explicit range/target are blocked-input; triple with detached/unknown branch and no explicit PR is blocked-input/triple-inconclusive, not effective double.
    A report-only request never authorizes an anchor commit; intended dirty/untracked state without a representing committed range is blocked-authorization.
    Single is exactly one read-only Codex reviewer agent launched with fork_turns=none in its own trusted-guard-materialized clean Git worktree; give it control metadata and refs, not a prebuilt full diff, and let it load applicable guidance and inspect the range with bounded Git/tools.
    Double adds an actual Claude Code process launched directly in another independent read-only worktree; capture raw stdout outside that worktree and require the manifest-bound named_lane_guard validate-claude-stream profile to return classification accepted before findings count; isolated_review and Copilot never count.
    Both Claude paths accept only publisher-verified strict stable >=2.1.211,<3.0.0, bind the selected release to its exact signed manifest/platform size/SHA, and require credential-free --version plus --help capability probes from one verified snapshot before credentials or review input.
    The named-direct lane accepts only ordinary local login in real HOME and exposes no API-key or OAuth-token interface.
    The low-level helper selects authentication with precedence ANTHROPIC_API_KEY > CLAUDE_CODE_OAUTH_TOKEN > local login and opaque-forwards only the winning explicit value; helper local login uses its private credential carrier/broker and guarded writeback, while helper API-key/OAuth modes bypass that transaction.
    Validate the exact preflight version/source with the closed legacy or extended structural init/intermediate/terminal profile plus any exact-version overlay.
    Before GitHub-lane work, read references/github-codex-evidence-authority.md and use its complete authenticated current-scope provider snapshot.
    Treat its pinned source commit 16366aa81270ad2c875d2ceb8ce194f5b2308af6, released-Action commit 2a7f9d8cd98f90cb56dc1540bf54d9dc7484afc6, common tree d03de9035d20f285e6a93986d436403b4a30e9bc, complete 15-path manifest, and result-present rationale as one atomic anti-drift receipt; floating refs, prose-only matches, and partial runtime diffs do not replace it.
    Record request_policy, provider_profile, and evidence_basis separately.
    Wait for the fresh Codex and actual Claude lanes to have terminal artifacts, post at most one exact @codex review request for an unchanged head, and never post a second or third request.
    For the one parent-owned write, capture a closed parent-recorded-request-scope-v1 sidecar with raw pre/post PR-detail and bound compare receipts plus the exact 201 POST response. Require both scope projections to equal the enclosing repository/PR/pr_merge_base/head tuple and the POST response to project type-preservingly to the request's eight top-level fields, including user.login and user.type. Store request_scope_receipts beside the unchanged raw transcript-v4 envelope, never as a fetch kind.
    A missing, malformed, extra, or unmatched sidecar makes request_policy unknown, forbids another POST while same-scope history is unproved, and disables the affected request/reaction evidence, but it does not prevent independently receipt-bound artifact-level terminal classification; that classification has scope_assurance artifact-publication-only and supplies no positive whole-PR completion. A valid old-head receipt remains old-epoch audit evidence and does not count as a current-head request; an old-epoch-only request/reaction seeded scope produces no current result entry and remains audit-only. A valid same-head/different-merge-base receipt is not this audit-only exception: it instead takes base-changed-same-head and forbids a replacement request. Never reattach an old-epoch reaction to the current scope. The sidecar proves neither request/run lineage nor continuous stability, and matching pre/post point reads do not exclude an intermediate ABA transition.
    Carry one parent-owned resource_budget sibling beside every independent historical discovery or current raw endpoint transcript, never inside transcript v4. Require the exact closed profile {profile: github-codex-evidence-resource-budget-v1, schema_version: 1, max_seeded_pull_requests: 512, max_controlled_requests: 512, max_fetch_attempts: 8192, max_retained_pages: 4096, max_records: 20000, max_page_body_bytes: 8388608, max_retained_utf8_bytes: 67108864, deadline_seconds: 900}. Historical schema-v4 discovery combines an updated-desc pull boundary, a fully paginated since-cutoff repository issue-comment feed, and current/declaration anchors; traverse every PR in that union. The 512 cap counts only union/detail scopes, never cumulative repository history or old boundary witnesses. Charge before request or accumulation under a monotonic deadline; overflow or an unverifiable bound selects unknown and discards the traversal, never truncation. The 20,000-record, 8-MiB response, and 64-MiB run magnitudes align with the pinned codex-review-gate-action; the remaining caps are playbook extensions.
    Reuse existing evidence and do not post a repair request.
    Record early-request-observed for an early request and duplicate-observed when more than one same-scope request exists, including an overlapping or pending extra request; those warnings are outcome-neutral.
    A lone compliant pending request is not a warning; positive completion remains pending unless a complete thumbs-up-clean reaction basis is accepted, while terminal findings remain blocking negative evidence and terminal clean is classification-only.
    Provider-evidence artifact classification does not require request/run attribution, but triple completion does.
    Triple then requires accepted current-head GitHub Codex evidence only on exact host github.com; every other host and operating identity hoteng or hoteng_cisco is unsupported.
    A complete terminal provider-authored current-head payload from exact chatgpt-codex-connector[bot] with REST type Bot and the authority's fixed clean/finding/inline-parent grammar supplies artifact-level clean/findings classification only; every other terminal-looking exact-provider payload is malformed. Every selected terminal basis records scope_assurance: artifact-publication-only, which records artifact-publication scope but does not attest the provider's internal input merge base or establish request/run/artifact lineage; it cannot complete triple or make the PR merge-ready. Terminal findings remain blocking negative evidence. Only a complete thumbs-up-clean reaction basis can complete the lane. Future positive terminal-payload authority requires a predeclared provider-authenticated input-base or request/run/artifact binding; the current accepted provider-input-binding schema set is empty.
    An independently trustworthy current terminal clean/findings artifact defaults to terminal-payload classification even when the provider declaration is missing or historical traversal, pagination, endpoint/artifact budget, or request-sidecar validation fails. Those historical adaptation-plane failures prevent mixed and weak reaction authority only. Run optional history before the final current reread and use fresh current trackers afterward, so historical elapsed time cannot expire current classification authority; current endpoint/artifact receipt, identity, scope, lifecycle, thread, ancestry, grammar, selection, or final-stability failure still blocks.
    Fetch the selected review body plus every fully paginated associated inline review comment, or the complete terminal issue-comment body, and include relevant thread state in the final re-read.
    In mixed, a trustworthy current-scope terminal payload controls artifact classification precedence regardless of reaction ordering; a later +1, eyes, or other reaction never overturns it, but mixed never accepts reaction-only clean and the payload supplies no positive completion authority. Eyes is liveness-only and affects only reaction-only fallback, where eyes at or after the selected +1 prevents weak clean.
    Only a complete thumbs-up-clean reaction basis can reach the weak +1 fallback and positively complete the GitHub Codex lane. Its 3-10 historical samples come from distinct non-current scopes; validate the exact current scope separately and never count it toward that minimum. Each historical sample and the separate current snapshot binds one selected exact @codex review parent's eight fields and exact request-time scope sidecar to its individual child exact-bot +1 with strict reaction.created_at > request.request_server_time ordering, enumerates every accepted same-scope request/sidecar and fully paginated reaction so a newer request, old-epoch reattachment, or cross-parent conflict cannot be hidden, and binds the provider declaration identity/digest. The selected +1 parent is the unique latest request by semantic time.
    Apply the frozen as-of cutoff only after complete schema, native-ID, canonical-URL/parent-join, timestamp, and actor validation. A confirmed-different non-request issue comment created wholly after the cutoff, confirmed-different submitted review after the cutoff, or confirmed-different reaction after the cutoff remains raw-only and may be excluded from the semantic projection. A controlled @codex review request, exact-provider or ambiguous/provider-like record, exact/ambiguous child, or cross-cutoff issue-comment edit remains fail-closed. Transcript v4 has no inline-child timestamp with which to infer that a later reply on an in-cutoff provider review is removable suffix noise.
    Accept the declaration only as the canonical GitHub REST issue-comment resource that the parent reads directly and re-fetches unchanged during final revalidation, with exact user.login chatgpt-codex-connector[bot], user.type Bot, performed_via_github_app.slug chatgpt-codex-connector, exact repository/PR/API-URL/HTML-URL bindings, and the exact declaration line: If Codex has suggestions, it will comment; otherwise it will react with 👍. Both bounded dual-source discovery passes include its bound PR as an explicit anchor, fully traverse it, and find that exact record once. Declaration authority and terminal classification are orthogonal: the same artifact may prove the declaration and independently classify as clean, findings, or malformed. Only an independently nonterminal declaration record and the closed progress-only grammar are audit-only; a declaration-only nonterminal PR is a confirmed non-candidate. Any other exact-provider free-form prose fails closed, and in-window terminal-looking malformed prose remains a candidate. A fully parsed malformed record at or before the exclusive lower boundary remains audit-only confirmed-non-candidate evidence. Generic issuer/source fields, caller-supplied records, and self-hashed paraphrases are invalid.
    request_policy.status is exactly compliant, warning, unknown, or not-applicable. A proved no-PR or unsupported-host/identity path uses not-applicable; unprovable early-request timing uses unknown without a warning code. A proved pre-provider blocker reports provider_profile: null and evidence_basis: null. An eligible wait uses the computed profile or unknown with evidence_basis: null. Classified terminal clean/findings uses terminal-payload or mixed plus its selected artifact-publication-only basis without completing the lane; accepted positive completion uses thumbs-up-clean plus its complete reaction basis. An inconclusive result uses its computed profile or unknown and a stable blocking basis when one exists, otherwise null.
    Absent blocking terminal findings, when no complete thumbs-up-clean reaction basis is accepted, missing terminal evidence or an unestablished reaction-only profile remains pending while bounded waiting is meaningful; after the wait is exhausted, ambiguous scope, payload, pagination, profile, or final re-read means triple-inconclusive. An accepted terminal clean classification is immediately triple-inconclusive.
    Only a valid request-time scope sidecar can prove the dedicated post-request base-only retarget event. That retarget invalidates whole-PR reaction evidence but cannot authorize a replacement same-head request or old-epoch reaction reattachment: report blocked-input base-changed-same-head and effective triple-inconclusive until a separately authorized ordinary change creates a new head; never manufacture an empty or anchor commit. A missing sidecar instead leaves request policy unknown and preserves independently scoped local gates and artifact-level terminal classification, never positive completion.
    An exact app-slug chatgpt-codex-connector current-head check/run whose non-null started_at is strictly later than the request proves service start only; it never completes triple or proves clean/no-findings even when completed/success.
    A same-App check may be unrelated and success may coexist with review findings.
    Proved no PR or directly unsupported host/identity means effective double. The fixed authority baseline has no accepted no-start body grammar and an empty accepted structured capability/installation schema set, so integration/service uncertainty and free-form exact-bot prose cannot currently prove this fallback. The accepted provider-authenticated input-base or request/run/artifact binding schema set is also empty.
    An existing supported PR/head mismatch without separate mutation authorization means requested triple, effective triple-inconclusive, and GitHub lane blocked-authorization.
    A missing response, otherwise valid nonterminal/check-only evidence, or a retryable transport/read failure remains pending while bounded waiting is meaningful; after exhaustion, it is triple-inconclusive. Unknown provider identity, malformed/stale evidence, a non-retryable failure, or an unstable lifecycle/scope/provider-artifact/thread/selected-terminal final read is immediately triple-inconclusive. Complete duplicate/pending request and reaction pages remain audit inputs, but stable or changing records affect only request/reaction authority and never overturn an independently stable terminal classification. Sidecar-only instability instead makes request_policy unknown and disables reaction completion while preserving that classification.
    Do not add retired extra Codex gates.
