            current_runtime_loader_binding="$(compute_runtime_loader_binding)" \
              || current_runtime_loader_binding="<unreadable>"
            current_runtime_symlink_binding="$(compute_runtime_symlink_binding)" \
              || current_runtime_symlink_binding="<unsafe>"
            current_runtime_tree_binding="$(compute_runtime_tree_binding)" \
              || current_runtime_tree_binding="<unreadable>"
            current_runtime_identity="$(probe_runtime_identity)" \
              || current_runtime_identity="<invalid>"
            current_runtime_special="$(/usr/bin/sudo /usr/bin/find "$runtime_root" ! -type d ! -type f ! -type l -print -quit)" \
              || current_runtime_special="<unreadable>"
            current_runtime_hardlink="$(/usr/bin/sudo /usr/bin/find "$runtime_root" -type f -links +1 -print -quit)" \
              || current_runtime_hardlink="<unreadable>"
