name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  platform_tests:
    name: platform-tests (${{ matrix.os }})
    needs:
      - python-39-compatibility
      - platform-safety
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1; python_version < "3.11"'
      - name: Install Linux isolation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap gcc ripgrep socat
      - name: Enable unprivileged user namespaces for Linux isolation test
        if: runner.os == 'Linux'
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check synced review helper syntax without bytecode
        run: |
          python3 -B -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]' \
            personal_codex/skills/review-orchestration-playbook/scripts/isolated_review \
            personal_codex/skills/review-orchestration-playbook/scripts/named_claude_preflight \
            personal_codex/skills/review-orchestration-playbook/scripts/named_lane_guard \
            personal_codex/skills/review-orchestration-playbook/scripts/validate_claude_stream.py \
            personal_codex/skills/review-orchestration-playbook/scripts/review_runtime/*.py
      - name: Check Linux launcher C syntax
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -fsyntax-only personal_codex/skills/review-orchestration-playbook/scripts/review_runtime/claude_linux_launcher.c
      - name: Verify canonical review workflow
        run: |
          python3 -m unittest discover \
            -s personal_codex/skills/review-orchestration-playbook/tests \
            -p 'test_*.py'
      - name: Verify private overlay sync on macOS
        if: runner.os == 'macOS'
        run: |
          python3 -m unittest discover \
            -s tests \
            -p 'test_private_overlay_sync.py'
      - name: Run real Linux isolation integration test
        if: runner.os == 'Linux'
        env:
          CODEX_REVIEW_RUN_LINUX_ISOLATION_INTEGRATION: "1"
        run: |
          python3 -m unittest -v personal_codex/skills/review-orchestration-playbook/tests/test_claude_linux.py
      - name: Check private overlay helper syntax without bytecode
        if: runner.os == 'Linux'
        run: |
          python3 -B -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]' \
            scripts/codex_personal_sync.py \
            scripts/build_personal_codex_package.py \
            scripts/validate_sync_manifest_changes.py \
            scripts/private_overlay_release.py \
            scripts/sync_private_overlay_sources.py \
            tests/test_private_overlay_package.py \
            tests/test_private_overlay_sync.py \
            tests/test_sync_manifest_changes.py
      - name: Build and verify private overlay
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s tests
      - name: Validate sync manifest changes
        if: runner.os == 'Linux'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate_sync_manifest_changes.py --base-ref "$BASE_REF"
      - name: Verify waited-delivery review contract
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover \
            -s personal_codex/skills/waited-delivery/tests \
            -p 'test_*.py'
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  broker_reproducibility:
    name: broker-reproducibility (macos-26)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require hosted-runner byte reproduction
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          /bin/bash \
            personal_codex/skills/review-orchestration-playbook/scripts/build_claude_keychain_broker_macos.sh \
            --check

  independent_supervisor_tests:
    name: independent-supervisor (python-3.13)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check independent review supervisor syntax without bytecode
        working-directory: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        run: |
          python3 -B -c 'import pathlib; paths = [pathlib.Path("independent-codex-pr-review"), *sorted(pathlib.Path("review_supervisor").rglob("*.py"))]; [compile(path.read_bytes(), str(path), "exec") for path in paths]'
      - name: Report hosted no-child runtime fingerprint
        run: |
          /usr/bin/sw_vers -productVersion
          /usr/bin/sw_vers -buildVersion
          /usr/bin/uname -r
          /usr/bin/uname -m
          /usr/bin/shasum -a 256 /usr/bin/sandbox-exec
      - name: Match hosted no-child blocker signature
        working-directory: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        env:
          CODEX_REVIEW_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CODEX_REVIEW_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          python3 -m tests.run_hosted_no_child_fail_closed
      - name: Run deterministic independent supervisor tests
        working-directory: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        run: |
          python3 -m tests.run_required_deterministic_supervisor
      - name: Verify installed release tree remains immutable
        working-directory: personal_codex/skills/review-orchestration-playbook/tests
        run: |
          python3 -m unittest -v test_contracts.RepositoryContractTest.test_installed_supervisor_preflight_keeps_release_tree_immutable
      - name: Verify independent review supervisor CLI
        working-directory: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        run: |
          python3 independent-codex-pr-review --help
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  readonly_install_supervisor_tests:
    name: read-only-install-supervisor (python-3.13)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run deterministic supervisor from read-only install
        env:
          REVIEW_SOURCE_RELATIVE: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        run: |
          trusted_python="$(command -v python3)"
          test -x "$trusted_python"
          isolated_root="$(/usr/bin/sudo /usr/bin/mktemp -d /Users/codex-review-readonly.XXXXXX)"
          echo "Read-only isolation recovery root: $isolated_root"
          if [[ ! "$isolated_root" =~ ^/Users/codex-review-readonly\.[[:alnum:]]{6}$ ]]; then
            echo "::error::Refusing an unexpected isolation root; retained at $isolated_root"
            exit 1
          fi
          /usr/bin/sudo /bin/test -d "$isolated_root"
          /usr/bin/sudo /bin/test ! -L "$isolated_root"
          isolated_object_id="$(/usr/bin/sudo /usr/bin/stat -f '%d:%i' "$isolated_root")"
          test "$(/usr/bin/sudo /usr/bin/stat -f '%u' "$isolated_root")" = "0"
          checkout_root="$(pwd -P)"
          source_review_profile="$checkout_root/$REVIEW_SOURCE_RELATIVE/tests/readonly_child_isolation.sb"
          /bin/test -f "$source_review_profile"
          /bin/test ! -L "$source_review_profile"
          source_profile_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp:%z:%m' "$source_review_profile")"
          /usr/bin/sudo /bin/chmod 0711 "$isolated_root"
          /usr/bin/sudo /bin/mkdir -m 0700 "$isolated_root/payload"
          /usr/bin/sudo /usr/sbin/chown nobody:nobody "$isolated_root/payload"
          /usr/bin/sudo -u nobody /bin/test ! -w /Users
          /usr/bin/sudo -u nobody /bin/test ! -w "$isolated_root"
          /usr/bin/sudo -u nobody /usr/bin/ditto "$REVIEW_SOURCE_RELATIVE" "$isolated_root/payload/source"
          /usr/bin/sudo -u nobody /bin/mkdir -m 0700 "$isolated_root/payload/runtime"
          review_profile="$isolated_root/readonly_child_isolation.sb"
          /usr/bin/sudo /bin/test ! -e "$review_profile"
          /usr/bin/sudo /bin/test ! -L "$review_profile"
          /usr/bin/sudo /bin/cp "$source_review_profile" "$review_profile"
          /usr/bin/sudo /usr/sbin/chown root:wheel "$review_profile"
          /usr/bin/sudo /bin/chmod -N "$review_profile"
          /usr/bin/sudo /bin/chmod 0444 "$review_profile"
          /usr/bin/sudo /bin/test -f "$review_profile"
          /usr/bin/sudo /bin/test ! -L "$review_profile"
          /usr/bin/sudo /usr/bin/cmp -s "$source_review_profile" "$review_profile"
          profile_binding="$(/usr/bin/sudo /usr/bin/stat -f '%d:%i:%u:%g:%Lp' "$review_profile")"
          test "$(/usr/bin/sudo /usr/bin/stat -f '%u:%g:%Lp' "$review_profile")" = "0:0:444"
          /bin/test ! -w "$review_profile"
          /usr/bin/sudo -u nobody /bin/test -r "$review_profile"
          /usr/bin/sudo -u nobody /bin/test ! -w "$review_profile"
          source_profile_postcopy_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp:%z:%m' "$source_review_profile")"
          if [[ "$source_profile_postcopy_binding" != "$source_profile_binding" ]] \
            || ! /bin/test -f "$source_review_profile" \
            || /bin/test -L "$source_review_profile" \
            || ! /usr/bin/sudo /usr/bin/cmp -s "$source_review_profile" "$review_profile"; then
            echo "::error::Checkout child profile changed while copying; retained at $isolated_root"
            exit 1
          fi
          /usr/bin/sudo /usr/bin/chflags uchg "$isolated_root"
          isolated_flags="$(/usr/bin/sudo /usr/bin/stat -f '%f' "$isolated_root")"
          (( (isolated_flags & 2) == 2 ))
          test -n "${RUNNER_TEMP:-}"
          /usr/bin/sudo -u nobody /bin/test ! -w "$RUNNER_TEMP"
          summary_file="$(/usr/bin/mktemp "$RUNNER_TEMP/codex-review-readonly-summary.XXXXXX")"
          echo "Read-only supervisor summary file (retained on failure): $summary_file"
          /bin/test -f "$summary_file"
          /bin/test ! -L "$summary_file"
          summary_object_id="$(/usr/bin/stat -f '%d:%i' "$summary_file")"
          set -o pipefail
          literal_profile_status=0
          /usr/bin/grep -Fq '(literal ' "$review_profile" \
            || literal_profile_status=$?
          if ! /usr/bin/grep -Fqx '(deny job-creation)' "$review_profile" \
            || ! /usr/bin/grep -Fqx '(deny process-exec*' "$review_profile" \
            || ! /usr/bin/grep -Fqx '  (file-mode #o4000 #o2000))' "$review_profile" \
            || (( literal_profile_status != 1 )); then
            echo "::error::Read-only child profile lacks required denials; retained at $isolated_root"
            exit 1
          fi
          source_profile_prelaunch_binding=""
          source_profile_prelaunch_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp:%z:%m' "$source_review_profile")" \
            || source_profile_prelaunch_binding="<unreadable>"
          profile_prelaunch_binding=""
          profile_prelaunch_binding="$(/usr/bin/sudo /usr/bin/stat -f '%d:%i:%u:%g:%Lp' "$review_profile")" \
            || profile_prelaunch_binding="<unreadable>"
          if [[ "$source_profile_prelaunch_binding" != "$source_profile_binding" ]] \
            || ! /bin/test -f "$source_review_profile" \
            || /bin/test -L "$source_review_profile" \
            || ! /usr/bin/sudo /usr/bin/cmp -s "$source_review_profile" "$review_profile" \
            || [[ "$profile_prelaunch_binding" != "$profile_binding" ]] \
            || ! /bin/test -f "$review_profile" \
            || /bin/test -L "$review_profile" \
            || /bin/test -w "$review_profile" \
            || ! /usr/bin/sudo -u nobody /bin/test -r "$review_profile" \
            || /usr/bin/sudo -u nobody /bin/test -w "$review_profile"; then
            echo "::error::Read-only child profile changed before launch; retained at $isolated_root"
            exit 1
          fi
          runner_status=0
          /usr/bin/sudo -u nobody /usr/bin/sandbox-exec -f "$review_profile" /usr/bin/env -i \
            CODEX_REVIEW_TEST_RUNTIME_PARENT="$isolated_root/payload/runtime" \
            HOME="$isolated_root/payload" \
            LANG=C \
            LC_ALL=C \
            LOGNAME=nobody \
            PATH=/usr/bin:/bin \
            USER=nobody \
            /bin/sh -c 'cd "$1" && exec "$2" -B -m tests.run_readonly_install_deterministic_supervisor' \
            sh "$isolated_root/payload/source" "$trusted_python" \
            | /usr/bin/tee "$summary_file" >/dev/null || runner_status=$?
          source_profile_postrun_binding=""
          source_profile_postrun_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp:%z:%m' "$source_review_profile")" \
            || source_profile_postrun_binding="<unreadable>"
          profile_postrun_binding=""
          profile_postrun_binding="$(/usr/bin/sudo /usr/bin/stat -f '%d:%i:%u:%g:%Lp' "$review_profile")" \
            || profile_postrun_binding="<unreadable>"
          if [[ "$source_profile_postrun_binding" != "$source_profile_binding" ]] \
            || ! /bin/test -f "$source_review_profile" \
            || /bin/test -L "$source_review_profile" \
            || ! /usr/bin/sudo /usr/bin/cmp -s "$source_review_profile" "$review_profile" \
            || [[ "$profile_postrun_binding" != "$profile_binding" ]] \
            || ! /bin/test -f "$review_profile" \
            || /bin/test -L "$review_profile" \
            || /bin/test -w "$review_profile" \
            || ! /usr/bin/sudo -u nobody /bin/test -r "$review_profile" \
            || /usr/bin/sudo -u nobody /bin/test -w "$review_profile"; then
            echo "::error::Read-only child profile changed during launch; retained at $isolated_root"
            exit 1
          fi
          current_summary_object_id=""
          current_summary_object_id="$(/usr/bin/stat -f '%d:%i' "$summary_file")" \
            || current_summary_object_id="<unreadable>"
          if [[ "$current_summary_object_id" != "$summary_object_id" ]]; then
            echo "::error::Supervisor summary identity changed; retained at $isolated_root"
            exit 1
          fi
          /bin/cat "$summary_file"
          if (( runner_status != 0 )); then
            echo "::error::Read-only supervisor exited $runner_status; retained at $isolated_root"
            exit "$runner_status"
          fi
          summary_status=0
          "$trusted_python" -I -B -S -c 'import json, pathlib, sys; raw = pathlib.Path(sys.argv[1]).read_bytes(); valid_line = raw.endswith(b"\n") and b"\n" not in raw[:-1] and b"\r" not in raw; reject_duplicates = lambda pairs: dict(pairs) if len(dict(pairs)) == len(pairs) else (_ for _ in ()).throw(ValueError("duplicate JSON key")); payload = json.loads(raw, object_pairs_hook=reject_duplicates) if valid_line else {}; expected = {"child_process_closure": "proven", "cleanup_failures": [], "cleanup_status": "complete", "install_parent_is_sticky_world_writable": True, "primary_failure": None, "primary_status": "complete", "release_tree_immutable": True, "release_tree_property": "object-identity-content-access-policy", "retained_paths": [], "returncode": 0, "runtime_residue": [], "secondary_failures": [], "signal_number": None, "timed_out": False}; keys_exact = isinstance(payload, dict) and set(payload) == set(expected); invalid_values = {key: payload.get(key) for key, value in expected.items() if key not in payload or type(payload[key]) is not type(value) or payload[key] != value} if isinstance(payload, dict) else {"payload_type": type(payload).__name__}; sys.exit("invalid terminal supervisor summary: " + json.dumps({"invalid_values": invalid_values, "keys_exact": keys_exact}, sort_keys=True, separators=(",", ":"))) if not valid_line or not keys_exact or invalid_values else None' \
            "$summary_file" || summary_status=$?
          if (( summary_status != 0 )); then
            echo "::error::Terminal supervisor evidence was not cleanup-safe; retained at $isolated_root"
            exit "$summary_status"
          fi
          current_object_id=""
          current_object_id="$(/usr/bin/sudo /usr/bin/stat -f '%d:%i' "$isolated_root")" \
            || current_object_id="<unreadable>"
          if [[ "$current_object_id" != "$isolated_object_id" ]] \
            || ! /usr/bin/sudo /bin/test -d "$isolated_root" \
            || ! /usr/bin/sudo /bin/test ! -L "$isolated_root" \
            || [[ "$(/usr/bin/sudo /usr/bin/stat -f '%u' "$isolated_root")" != "0" ]] \
            || [[ "$(/usr/bin/sudo /usr/bin/stat -f '%f' "$isolated_root")" != "$isolated_flags" ]]; then
            echo "::error::Isolation root identity changed; retained at $isolated_root"
            exit 1
          fi
          /usr/bin/sudo /usr/bin/chflags nouchg "$isolated_root"
          post_clear_object_id=""
          post_clear_object_id="$(/usr/bin/sudo /usr/bin/stat -f '%d:%i' "$isolated_root")" \
            || post_clear_object_id="<unreadable>"
          if [[ "$post_clear_object_id" != "$isolated_object_id" ]]; then
            if /usr/bin/sudo /bin/test -d "$isolated_root" \
              && /usr/bin/sudo /bin/test ! -L "$isolated_root"; then
              /usr/bin/sudo /usr/bin/chflags uchg "$isolated_root" || true
            fi
            echo "::error::Isolation root changed while opening cleanup; retained at $isolated_root"
            exit 1
          fi
          root_cleanup_status=0
          /usr/bin/sudo /bin/rm -rf "$isolated_root" || root_cleanup_status=$?
          if (( root_cleanup_status != 0 )) \
            || /usr/bin/sudo /bin/test -e "$isolated_root" \
            || /usr/bin/sudo /bin/test -L "$isolated_root"; then
            if /usr/bin/sudo /bin/test -d "$isolated_root" \
              && /usr/bin/sudo /bin/test ! -L "$isolated_root"; then
              /usr/bin/sudo /usr/bin/chflags uchg "$isolated_root" || true
            fi
            echo "::error::Isolation root cleanup incomplete at $isolated_root"
            exit 1
          fi
          final_summary_object_id=""
          final_summary_object_id="$(/usr/bin/stat -f '%d:%i' "$summary_file")" \
            || final_summary_object_id="<unreadable>"
          if [[ "$final_summary_object_id" != "$summary_object_id" ]] \
            || ! /bin/test -f "$summary_file" \
            || /bin/test -L "$summary_file"; then
            echo "::error::Summary cleanup identity changed; retained at $summary_file"
            exit 1
          fi
          summary_cleanup_status=0
          /bin/rm "$summary_file" || summary_cleanup_status=$?
          if (( summary_cleanup_status != 0 )) \
            || /bin/test -e "$summary_file" \
            || /bin/test -L "$summary_file"; then
            echo "::error::Summary cleanup incomplete at $summary_file"
            exit 1
          fi
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  python-39-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Check supported runtime syntax without bytecode
        run: |
          python3 -B -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]' \
            scripts/codex_personal_sync.py \
            scripts/build_personal_codex_package.py \
            scripts/validate_sync_manifest_changes.py
      - name: Run Python 3.9 compatibility regressions
        run: |
          python3 -m unittest \
            tests.test_personal_sync_reconciliation_safety.PendingLinkTransactionSafetyTests.test_empty_record_empty_state_transaction_parses_and_recovers \
            tests.test_personal_sync_reconciliation_safety.PendingLinkTransactionSafetyTests.test_oversized_json_integer_is_normalized_to_sync_error \
            tests.test_package_builder_safety.PackageBuilderSafetyTests.test_manifest_parser_reports_deep_json_as_package_error \
            tests.test_package_builder_safety.PackageBuilderSafetyTests.test_manifest_parser_reports_oversized_integer_as_package_error \
            tests.test_release_manifest_baseline.ReleaseManifestBaselineTests.test_release_baseline_accepts_verified_release_history \
            tests.test_sync_manifest_changes.SyncManifestChangeTests.test_manifest_transition_counts_same_target_change_once \
            tests.test_sync_manifest_changes.ManifestSerializationSafetyTests.test_deep_raw_json_is_reported_as_validation_error \
            tests.test_sync_manifest_changes.ManifestSerializationSafetyTests.test_oversized_integer_is_reported_as_validation_error
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  platform-safety:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run platform reconciliation safety tests
        run: python3 -m unittest tests.test_personal_sync_reconciliation_safety
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  test:
    name: test
    if: ${{ always() }}
    needs:
      - platform_tests
      - python-39-compatibility
      - platform-safety
      - broker_reproducibility
      - independent_supervisor_tests
      - readonly_install_supervisor_tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform test to pass
        env:
          PLATFORM_TESTS_RESULT: ${{ needs.platform_tests.result }}
          PYTHON_39_RESULT: ${{ needs.python-39-compatibility.result }}
          PLATFORM_SAFETY_RESULT: ${{ needs.platform-safety.result }}
          BROKER_REPRODUCIBILITY_RESULT: ${{ needs.broker_reproducibility.result }}
          INDEPENDENT_SUPERVISOR_RESULT: ${{ needs.independent_supervisor_tests.result }}
          READONLY_INSTALL_SUPERVISOR_RESULT: ${{ needs.readonly_install_supervisor_tests.result }}
        run: |
          test "$PLATFORM_TESTS_RESULT" = "success"
          test "$PYTHON_39_RESULT" = "success"
          test "$PLATFORM_SAFETY_RESULT" = "success"
          test "$BROKER_REPRODUCIBILITY_RESULT" = "success"
          test "$INDEPENDENT_SUPERVISOR_RESULT" = "success"
          test "$READONLY_INSTALL_SUPERVISOR_RESULT" = "success"
