          test "$(/usr/bin/sudo /usr/bin/stat -f '%u:%g:%Lp:%l' "$isolated_python")" = "0:0:555:1"
          verify_runtime_custody() {
            local phase="$1"
            local current_runtime_root_binding=""
            local current_isolated_python_binding=""
            local current_isolated_python_digest=""
            local current_runtime_loader_binding=""
            local current_runtime_symlink_binding=""
            local current_runtime_tree_binding=""
            local current_runtime_identity=""
            local current_runtime_special=""
            local current_runtime_hardlink=""
            local current_runtime_owner_violation=""
            local current_runtime_write_violation=""
            local current_runtime_read_violation=""
            local current_runtime_traverse_violation=""
            local current_runtime_xattr_violation=""
            local current_runtime_acl_violation=""
            local current_codesign_status=0
