            || final_summary_object_id="<unreadable>"
          if [[ "$final_summary_object_id" != "$summary_object_id" ]] \
            || ! /bin/test -f "$summary_file" \
            || /bin/test -L "$summary_file"; then
            echo "::error::Summary cleanup identity changed; retained at $summary_file"
            exit 1
          fi
          summary_cleanup_status=0
          /bin/rm "$summary_file" || summary_cleanup_status=$?
          if (( summary_cleanup_status != 0 )) \
            || /bin/test -e "$summary_file" \
            || /bin/test -L "$summary_file"; then
            echo "::error::Summary cleanup incomplete at $summary_file"
            exit 1
          fi
      - name: Require source-only Python tree
        if: always()
        run: |
          bytecode_artifact=""
          if ! bytecode_artifact="$(/usr/bin/find . \
            \( -name __pycache__ -o -name '*.pyc' -o -name '*.pyo' \) \
            -print -quit)"; then
            echo "::error::Unable to inspect the checkout for Python bytecode artifacts"
            exit 1
          fi
          if [[ -n "$bytecode_artifact" ]]; then
