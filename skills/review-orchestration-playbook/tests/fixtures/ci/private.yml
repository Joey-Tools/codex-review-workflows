            || /bin/test -L "$review_profile" \
            || /bin/test -w "$review_profile" \
            || ! run_review_user /bin/test -r "$review_profile" \
            || run_review_user /bin/test -w "$review_profile"; then
            echo "::error::Read-only child profile changed during launch; retained at $isolated_root"
            exit 1
          fi
          current_summary_object_id=""
          current_summary_object_id="$(/usr/bin/stat -f '%d:%i' "$summary_file")" \
            || current_summary_object_id="<unreadable>"
          if [[ "$current_summary_object_id" != "$summary_object_id" ]]; then
            echo "::error::Supervisor summary identity changed; retained at $isolated_root"
            exit 1
          fi
          if (( runner_status != 0 )); then
            echo "::error::Read-only supervisor exited $runner_status; retained at $isolated_root"
            exit "$runner_status"
          fi
          if (( review_account_postrun_status != 0 )); then
            /usr/bin/printf '%s\n' \
              "::error::Ephemeral review account changed or retained processes during launch"
            /usr/bin/printf '%s\n' \
              "Ephemeral review account retention: name=$review_user uid=$review_uid pids=${review_processes_postrun//$'\n'/,} diagnostics=$review_process_diagnostics"
            exit 1
          fi
          summary_status=0
          "$isolated_python" -I -B -S -c 'import json, pathlib, sys; raw = pathlib.Path(sys.argv[1]).read_bytes(); valid_line = raw.endswith(b"\n") and b"\n" not in raw[:-1] and b"\r" not in raw; reject_duplicates = lambda pairs: dict(pairs) if len(dict(pairs)) == len(pairs) else (_ for _ in ()).throw(ValueError("duplicate JSON key")); payload = json.loads(raw, object_pairs_hook=reject_duplicates) if valid_line else {}; expected = {"child_process_closure": "proven", "cleanup_failures": [], "cleanup_guarantee": "custodied-manifest-quarantine-descriptor-revalidation-same-uid-final-rename-unlink-host-tcb", "cleanup_status": "complete", "creation_origin_guarantee": "best-effort-128-bit-leaf-immediate-nofollow-open-same-uid-host-tcb", "creation_origin_proven": False, "install_parent_is_sticky_world_writable": True, "no_child_runtime_profile": None, "primary_failure": None, "primary_status": "complete", "release_tree_immutable": True, "release_tree_property": "object-identity-content-access-policy", "retained_paths": [], "returncode": 0, "runtime_residue": [], "secondary_failures": [], "signal_number": None, "source_head_bound": False, "source_head_sha": None, "source_head_subtree_manifest_sha256": None, "source_manifest_sha256": None, "timed_out": False}; source_manifest = payload.get("source_manifest_sha256") if isinstance(payload, dict) else None; source_manifest_valid = type(source_manifest) is str and len(source_manifest) == 64 and all(character in "0123456789abcdef" for character in source_manifest); expected["source_manifest_sha256"] = source_manifest; keys_exact = isinstance(payload, dict) and set(payload) == set(expected); invalid_values = {key: payload.get(key) for key, value in expected.items() if key not in payload or type(payload[key]) is not type(value) or payload[key] != value} if isinstance(payload, dict) else {"payload_type": type(payload).__name__}; invalid_values.update({} if source_manifest_valid else {"source_manifest_sha256_contract": {"length": len(source_manifest) if type(source_manifest) is str else None, "type": type(source_manifest).__name__}}); sys.exit("invalid terminal supervisor summary: " + json.dumps({"invalid_values": invalid_values, "keys_exact": keys_exact}, sort_keys=True, separators=(",", ":"))) if not valid_line or not keys_exact or invalid_values else print(json.dumps(payload, ensure_ascii=True, sort_keys=True, separators=(",", ":")))' \
            "$summary_file" || summary_status=$?
          if (( summary_status != 0 )); then
            echo "::error::Terminal supervisor evidence was not cleanup-safe; retained at $isolated_root"
            exit "$summary_status"
          fi
          current_object_id=""
          current_object_id="$(/usr/bin/sudo /usr/bin/stat -f '%d:%i' "$isolated_root")" \
            || current_object_id="<unreadable>"
          if [[ "$current_object_id" != "$isolated_object_id" ]] \
            || ! /usr/bin/sudo /bin/test -d "$isolated_root" \
            || ! /usr/bin/sudo /bin/test ! -L "$isolated_root" \
            || [[ "$(/usr/bin/sudo /usr/bin/stat -f '%u' "$isolated_root")" != "0" ]] \
            || [[ "$(/usr/bin/sudo /usr/bin/stat -f '%Lp' "$isolated_root")" != "755" ]] \
            || [[ "$(/usr/bin/sudo /usr/bin/stat -f '%f' "$isolated_root")" != "$isolated_flags" ]]; then
            echo "::error::Isolation root identity changed; retained at $isolated_root"
            exit 1
          fi
          /usr/bin/sudo /usr/bin/chflags nouchg "$isolated_root"
          post_clear_object_id=""
          post_clear_object_id="$(/usr/bin/sudo /usr/bin/stat -f '%d:%i' "$isolated_root")" \
            || post_clear_object_id="<unreadable>"
          if [[ "$post_clear_object_id" != "$isolated_object_id" ]] \
            || [[ "$(/usr/bin/sudo /usr/bin/stat -f '%u:%Lp' "$isolated_root")" != "0:755" ]]; then
            if /usr/bin/sudo /bin/test -d "$isolated_root" \
              && /usr/bin/sudo /bin/test ! -L "$isolated_root"; then
              /usr/bin/sudo /usr/bin/chflags uchg "$isolated_root" || true
            fi
            echo "::error::Isolation root changed while opening cleanup; retained at $isolated_root"
            exit 1
          fi
          root_cleanup_status=0
          /usr/bin/sudo /bin/rm -rf "$isolated_root" || root_cleanup_status=$?
          if (( root_cleanup_status != 0 )) \
            || /usr/bin/sudo /bin/test -e "$isolated_root" \
            || /usr/bin/sudo /bin/test -L "$isolated_root"; then
            if /usr/bin/sudo /bin/test -d "$isolated_root" \
              && /usr/bin/sudo /bin/test ! -L "$isolated_root"; then
              /usr/bin/sudo /usr/bin/chflags uchg "$isolated_root" || true
            fi
            echo "::error::Isolation root cleanup incomplete at $isolated_root"
            exit 1
          fi
          final_summary_object_id=""
          final_summary_object_id="$(/usr/bin/stat -f '%d:%i' "$summary_file")" \
            || final_summary_object_id="<unreadable>"
          if [[ "$final_summary_object_id" != "$summary_object_id" ]] \
            || ! /bin/test -f "$summary_file" \
            || /bin/test -L "$summary_file"; then
            echo "::error::Summary cleanup identity changed; retained at $summary_file"
            exit 1
          fi
          summary_cleanup_status=0
          /bin/rm "$summary_file" || summary_cleanup_status=$?
          if (( summary_cleanup_status != 0 )) \
            || /bin/test -e "$summary_file" \
            || /bin/test -L "$summary_file"; then
            echo "::error::Summary cleanup incomplete at $summary_file"
            exit 1
          fi
      - name: Require source-only Python tree
        if: always()
        run: |
          bytecode_artifact=""
          if ! bytecode_artifact="$(/usr/bin/find . \
            \( -name __pycache__ -o -name '*.pyc' -o -name '*.pyo' \) \
            -print -quit)"; then
            echo "::error::Unable to inspect the checkout for Python bytecode artifacts"
            exit 1
          fi
          if [[ -n "$bytecode_artifact" ]]; then
            echo "::error::Python bytecode artifact: $bytecode_artifact"
            exit 1
          fi

  python-39-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Check supported runtime syntax without bytecode
        run: |
          python3 -B -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]' \
            scripts/codex_personal_sync.py \
            scripts/build_personal_codex_package.py \
            scripts/validate_sync_manifest_changes.py
      - name: Run Python 3.9 compatibility regressions
        run: |
          python3 -m unittest \
            tests.test_personal_sync_reconciliation_safety.PendingLinkTransactionSafetyTests.test_empty_record_empty_state_transaction_parses_and_recovers \
            tests.test_personal_sync_reconciliation_safety.PendingLinkTransactionSafetyTests.test_oversized_json_integer_is_normalized_to_sync_error \
            tests.test_package_builder_safety.PackageBuilderSafetyTests.test_manifest_parser_reports_deep_json_as_package_error \
            tests.test_package_builder_safety.PackageBuilderSafetyTests.test_manifest_parser_reports_oversized_integer_as_package_error \
            tests.test_release_manifest_baseline.ReleaseManifestBaselineTests.test_release_baseline_accepts_verified_release_history \
            tests.test_sync_manifest_changes.SyncManifestChangeTests.test_manifest_transition_counts_same_target_change_once \
            tests.test_sync_manifest_changes.ManifestSerializationSafetyTests.test_deep_raw_json_is_reported_as_validation_error \
            tests.test_sync_manifest_changes.ManifestSerializationSafetyTests.test_oversized_integer_is_reported_as_validation_error
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  platform-safety:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run platform reconciliation safety tests
        run: python3 -m unittest tests.test_personal_sync_reconciliation_safety
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  test:
    name: test
    if: ${{ always() }}
    needs:
      - platform_tests
      - python-39-compatibility
      - platform-safety
      - broker_reproducibility
      - independent_supervisor_tests
      - readonly_install_supervisor_tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform test to pass
        env:
          PLATFORM_TESTS_RESULT: ${{ needs.platform_tests.result }}
          PYTHON_39_RESULT: ${{ needs.python-39-compatibility.result }}
          PLATFORM_SAFETY_RESULT: ${{ needs.platform-safety.result }}
          BROKER_REPRODUCIBILITY_RESULT: ${{ needs.broker_reproducibility.result }}
          INDEPENDENT_SUPERVISOR_RESULT: ${{ needs.independent_supervisor_tests.result }}
          READONLY_INSTALL_SUPERVISOR_RESULT: ${{ needs.readonly_install_supervisor_tests.result }}
        run: |
          test "$PLATFORM_TESTS_RESULT" = "success"
          test "$PYTHON_39_RESULT" = "success"
          test "$PLATFORM_SAFETY_RESULT" = "success"
          test "$BROKER_REPRODUCIBILITY_RESULT" = "success"
          test "$INDEPENDENT_SUPERVISOR_RESULT" = "success"
          test "$READONLY_INSTALL_SUPERVISOR_RESULT" = "success"
