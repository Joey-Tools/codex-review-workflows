          review_group_origin_bound=false
          review_account_custody_active=false
          review_process_diagnostics="$isolated_root/review-process-diagnostics.log"
          /usr/bin/sudo /bin/test ! -e "$review_process_diagnostics"
          /usr/bin/sudo /usr/bin/touch "$review_process_diagnostics"
          /usr/bin/sudo /usr/sbin/chown root:wheel "$review_process_diagnostics"
          /usr/bin/sudo /bin/chmod -N "$review_process_diagnostics"
          /usr/bin/sudo /bin/chmod 0600 "$review_process_diagnostics"
          review_process_diagnostics_binding="$(/usr/bin/sudo /usr/bin/stat \
            -f '%d:%i:%u:%g:%Lp' "$review_process_diagnostics")"
          test "$review_process_diagnostics_binding" = \
            "$(/usr/bin/sudo /usr/bin/stat -f '%d:%i:0:0:600' "$review_process_diagnostics")"
          review_uid=""
          review_gid=""
          review_admin_gid="$(/usr/bin/dscl . -read /Groups/admin PrimaryGroupID \
            | /usr/bin/awk '$1 == "PrimaryGroupID:" {print $2}')"
          review_account_validation_reason="not-run"
          review_account_validation_expected="<unset>"
          review_account_validation_observed="<unset>"
          set_review_account_validation_failure() {
            review_account_validation_reason="$1"
            printf -v review_account_validation_expected '%q' "$2"
            printf -v review_account_validation_observed '%q' "$3"
          }
          report_review_account_validation_failure() {
            /usr/bin/printf '%s\n' \
              "::error::Ephemeral review account validation failed"
            /usr/bin/printf '%s\n' \
              "Ephemeral review account validation diagnostics: reason=$review_account_validation_reason expected=$review_account_validation_expected observed=$review_account_validation_observed"
          }
          verify_review_scalar_record() {
            local record_kind="$1"
            local attribute="$2"
            local expected_value="$3"
            local observed_record="$4"
            local expected_record="$attribute: $expected_value"
            if [[ "$observed_record" != "$expected_record" ]]; then
              set_review_account_validation_failure \
                "$record_kind.$attribute.mismatch" "$expected_record" "$observed_record"
              return 1
            fi
          }
          verify_review_record_attribute() {
            local record_kind="$1"
            local record_path="$2"
            local attribute="$3"
            local expected_value="$4"
            local expected_record="$attribute: $expected_value"
            local observed_record=""
            if ! observed_record="$(/usr/bin/sudo /usr/bin/dscl . -read "$record_path" "$attribute" 2>/dev/null)"; then
              set_review_account_validation_failure \
                "$record_kind.$attribute.unavailable" "$expected_record" "<unavailable>"
              return 1
            fi
            verify_review_scalar_record \
              "$record_kind" "$attribute" "$expected_value" "$observed_record"
          }
          review_account_processes() {
            local process_table=""
            if ! process_table="$(/bin/ps -axo ruid=,uid=,pid=)"; then
              return 1
            fi
            (( ${#process_table} <= 1048576 )) || return 1
            /usr/bin/awk -v target_uid="$review_uid" \
              '$1 == target_uid || $2 == target_uid {print $3}' \
              <<< "$process_table"
          }
          report_review_account_processes() {
            local current_binding=""
            local current_bytes=0
            local diagnostic=""
            local escaped=""
            local pid=""
            local pids="$1"
            local record=""
            local record_bytes=0
            local record_count=0
            while IFS= read -r pid; do
              [[ "$pid" =~ ^[[:digit:]]+$ ]] || continue
              (( record_count += 1 ))
              (( record_count <= 128 )) || return 1
              if ! diagnostic="$(/bin/ps -p "$pid" \
                -o pid= -o ppid= -o pgid= -o sess= -o state= \
                -o lstart= -o comm= -o command= 2>&1)"; then
                diagnostic="<unavailable>"
              elif (( ${#diagnostic} > 4096 )); then
                diagnostic="${diagnostic:0:4096}"
              fi
              printf -v escaped '%q' "$diagnostic"
              record="Ephemeral review process diagnostic: uid=$review_uid record=$escaped"
              current_binding="$(/usr/bin/sudo /usr/bin/stat \
                -f '%d:%i:%u:%g:%Lp' "$review_process_diagnostics")" \
                || return 1
              [[ "$current_binding" == "$review_process_diagnostics_binding" ]] \
                || return 1
              current_bytes="$(/usr/bin/sudo /usr/bin/stat \
                -f '%z' "$review_process_diagnostics")" \
                || return 1
              record_bytes="$(/usr/bin/printf '%s\n' "$record" \
                | /usr/bin/wc -c | /usr/bin/tr -d ' ')"
              [[ "$current_bytes" =~ ^[[:digit:]]+$ ]] \
                && [[ "$record_bytes" =~ ^[[:digit:]]+$ ]] \
                && (( current_bytes + record_bytes <= 1048576 )) \
                || return 1
              /usr/bin/printf '%s\n' "$record" \
                | /usr/bin/sudo /usr/bin/tee -a "$review_process_diagnostics" \
                  >/dev/null \
                || return 1
              current_binding="$(/usr/bin/sudo /usr/bin/stat \
                -f '%d:%i:%u:%g:%Lp' "$review_process_diagnostics")" \
                || return 1
              current_bytes="$(/usr/bin/sudo /usr/bin/stat \
                -f '%z' "$review_process_diagnostics")" \
                || return 1
              [[ "$current_binding" == "$review_process_diagnostics_binding" ]] \
                && [[ "$current_bytes" =~ ^[[:digit:]]+$ ]] \
                && (( current_bytes <= 1048576 )) \
                || return 1
            done <<< "$pids"
          }
          terminate_custodied_review_processes() {
            local absent_confirmations=0
            local deadline=$((SECONDS + 5))
            local pid=""
            local pids=""
            local signal_status=0
            if [[ "$review_account_custody_active" != "true" ]] \
              || ! verify_review_account; then
              return 1
            fi
            while (( SECONDS < deadline )); do
              verify_review_account || return 1
              pids="$(review_account_processes)" || return 1
              if [[ -z "$pids" ]]; then
                (( absent_confirmations += 1 ))
                if (( absent_confirmations >= 2 )); then
                  verify_review_account
                  return
                fi
                /bin/sleep 0.1
                continue
              fi
              absent_confirmations=0
              report_review_account_processes "$pids" || return 1
              signal_status=0
              while IFS= read -r pid; do
                [[ "$pid" =~ ^[[:digit:]]+$ ]] || return 1
                run_review_user /bin/kill -TERM "$pid" 2>/dev/null \
                  || signal_status=1
              done <<< "$pids"
              /bin/sleep 0.2
              verify_review_account || return 1
              pids="$(review_account_processes)" || return 1
              if [[ -n "$pids" ]]; then
                report_review_account_processes "$pids" || return 1
                while IFS= read -r pid; do
                  [[ "$pid" =~ ^[[:digit:]]+$ ]] || return 1
                  run_review_user /bin/kill -KILL "$pid" 2>/dev/null \
                    || signal_status=1
                done <<< "$pids"
              fi
              if (( signal_status != 0 )); then
                pids="$(review_account_processes)" || return 1
                [[ -z "$pids" ]] || return 1
              fi
              /bin/sleep 0.1
            done
            return 1
          }
          verify_review_group() {
            if [[ "$review_group_origin_bound" != "true" ]]; then
              set_review_account_validation_failure \
                "group.origin.unbound" "true" "$review_group_origin_bound"
              return 1
            fi
            verify_review_record_attribute \
              group "$review_group_path" GeneratedUID "$review_group_guid" \
              && verify_review_record_attribute \
                group "$review_group_path" PrimaryGroupID "$review_gid"
          }
          run_review_user() {
            /usr/bin/sudo -u "$review_user" -g "$review_group" "$@"
          }
          verify_review_cached_identity() {
            local cached_user_records=""
            local cached_group_records=""
            local cached_user_names=""
            local cached_group_names=""
            cached_user_records="$(/usr/bin/dscacheutil -q user -a uid "$review_uid")" \
              || {
                set_review_account_validation_failure \
                  "cache.user.unavailable" "$review_user" "<unavailable>"
                return 1
              }
            cached_group_records="$(/usr/bin/dscacheutil -q group -a gid "$review_gid")" \
              || {
                set_review_account_validation_failure \
                  "cache.group.unavailable" "$review_group" "<unavailable>"
                return 1
              }
            cached_user_names="$(/usr/bin/awk '$1 == "name:" {print $2}' <<< "$cached_user_records")" \
              || {
                set_review_account_validation_failure \
                  "cache.user.parse-failed" "$review_user" "<unavailable>"
                return 1
              }
            cached_group_names="$(/usr/bin/awk '$1 == "name:" {print $2}' <<< "$cached_group_records")" \
              || {
                set_review_account_validation_failure \
                  "cache.group.parse-failed" "$review_group" "<unavailable>"
                return 1
              }
            if [[ "$cached_user_names" != "$review_user" ]]; then
              set_review_account_validation_failure \
                "cache.user.name-mismatch" "$review_user" "$cached_user_names"
              return 1
            fi
            if [[ "$cached_group_names" != "$review_group" ]]; then
              set_review_account_validation_failure \
                "cache.group.name-mismatch" "$review_group" "$cached_group_names"
              return 1
            fi
          }
          verify_review_account() {
            local account_groups=""
            local observed_identity=""
            verify_review_group || return 1
            verify_review_cached_identity || return 1
            if [[ "$review_user_origin_bound" != "true" ]]; then
              set_review_account_validation_failure \
                "user.origin.unbound" "true" "$review_user_origin_bound"
              return 1
            fi
            verify_review_record_attribute \
              user "$review_user_path" GeneratedUID "$review_user_guid" \
              && verify_review_record_attribute \
                user "$review_user_path" UniqueID "$review_uid" \
              && verify_review_record_attribute \
                user "$review_user_path" PrimaryGroupID "$review_gid" \
              && verify_review_record_attribute \
                user "$review_user_path" NFSHomeDirectory /var/empty \
              && verify_review_record_attribute \
                user "$review_user_path" UserShell /usr/bin/false \
              && verify_review_record_attribute \
                user "$review_user_path" dsAttrTypeNative:IsHidden 1 \
              || return 1
            if ! observed_identity="$(/usr/bin/id -u "$review_user" 2>/dev/null)"; then
              set_review_account_validation_failure \
                "identity.user.uid-unavailable" "$review_uid" "<unavailable>"
              return 1
            fi
            if [[ "$observed_identity" != "$review_uid" ]]; then
              set_review_account_validation_failure \
                "identity.user.uid-mismatch" "$review_uid" "$observed_identity"
              return 1
            fi
            if ! observed_identity="$(/usr/bin/id -g "$review_user" 2>/dev/null)"; then
              set_review_account_validation_failure \
                "identity.user.gid-unavailable" "$review_gid" "<unavailable>"
              return 1
            fi
            if [[ "$observed_identity" != "$review_gid" ]]; then
              set_review_account_validation_failure \
                "identity.user.gid-mismatch" "$review_gid" "$observed_identity"
              return 1
            fi
            if ! observed_identity="$(run_review_user /usr/bin/id -u 2>/dev/null)"; then
              set_review_account_validation_failure \
                "identity.runtime.uid-unavailable" "$review_uid" "<unavailable>"
              return 1
            fi
            if [[ "$observed_identity" != "$review_uid" ]]; then
              set_review_account_validation_failure \
                "identity.runtime.uid-mismatch" "$review_uid" "$observed_identity"
              return 1
            fi
            if ! observed_identity="$(run_review_user /usr/bin/id -g 2>/dev/null)"; then
              set_review_account_validation_failure \
                "identity.runtime.gid-unavailable" "$review_gid" "<unavailable>"
              return 1
            fi
            if [[ "$observed_identity" != "$review_gid" ]]; then
              set_review_account_validation_failure \
                "identity.runtime.gid-mismatch" "$review_gid" "$observed_identity"
              return 1
            fi
            if ! account_groups="$(run_review_user /usr/bin/id -G 2>/dev/null)"; then
              set_review_account_validation_failure \
                "identity.runtime.groups-unavailable" "numeric group list" "<unavailable>"
              return 1
            fi
            if [[ ! "$account_groups" =~ ^[[:digit:]]+([[:space:]][[:digit:]]+)*$ ]]; then
              set_review_account_validation_failure \
                "identity.runtime.groups-malformed" "numeric group list" "$account_groups"
              return 1
            fi
            if [[ " $account_groups " != *" $review_gid "* ]]; then
              set_review_account_validation_failure \
                "identity.runtime.primary-group-missing" "$review_gid" "$account_groups"
              return 1
            fi
            if [[ " $account_groups " == *" $review_admin_gid "* ]]; then
              set_review_account_validation_failure \
                "policy.admin-group-present" "admin group absent" "$account_groups"
              return 1
            fi
            review_account_validation_reason="ok"
            review_account_validation_expected="<none>"
            review_account_validation_observed="<none>"
          }
          cleanup_review_account() {
            local primary_status=$?
            local cleanup_status=0
            local process_cleanup_proven=false
            local process_status=0
            local review_processes=""
            trap - EXIT
            set +e
            if [[ "$review_user_created" == "true" ]]; then
              if ! verify_review_account; then
                report_review_account_validation_failure
                echo "::error::Ephemeral review user identity or policy is unproven; retained until runner disposal: name=$review_user uid=$review_uid"
                cleanup_status=1
              else
                review_processes="$(review_account_processes)"
                process_status=$?
                if (( process_status != 0 )); then
                  /usr/bin/printf '%s\n' "::error::Ephemeral review account process census failed"
                  /usr/bin/printf '%s\n' \
                    "Ephemeral review account retention: name=$review_user uid=$review_uid"
                  cleanup_status=1
                elif [[ -z "$review_processes" ]]; then
                  process_cleanup_proven=true
                else
                  report_review_account_processes "$review_processes" \
                    || cleanup_status=1
                  if terminate_custodied_review_processes; then
                    process_status=0
                    review_processes="$(review_account_processes)" \
                      || process_status=$?
                    if (( process_status == 0 )) \
                      && [[ -z "$review_processes" ]]; then
                      process_cleanup_proven=true
                    else
                      cleanup_status=1
                    fi
                  else
                    cleanup_status=1
                  fi
                  if [[ -n "$review_processes" ]]; then
                    /usr/bin/printf '%s\n' "::error::Ephemeral review account process cleanup failed"
                    /usr/bin/printf '%s\n' \
                      "Ephemeral review account retention: name=$review_user uid=$review_uid"
                    cleanup_status=1
                  fi
                fi
                if [[ "$process_cleanup_proven" == "true" ]]; then
                  if ! /usr/bin/sudo /usr/bin/dscl . -delete "$review_user_path" \
                    || /usr/bin/sudo /usr/bin/dscl . -read "$review_user_path" >/dev/null 2>&1; then
                    echo "::error::Ephemeral review user cleanup failed; retained until runner disposal: name=$review_user uid=$review_uid"
                    cleanup_status=1
                  else
                    review_user_created=false
                  fi
                fi
              fi
            fi
            if [[ "$review_group_created" == "true" ]]; then
              if [[ "$review_user_created" == "true" ]]; then
                echo "::error::Ephemeral review group retained with its user until runner disposal: name=$review_group gid=$review_gid"
                cleanup_status=1
              elif ! verify_review_group; then
                report_review_account_validation_failure
                echo "::error::Ephemeral review group identity or policy is unproven; retained until runner disposal: name=$review_group gid=$review_gid"
                cleanup_status=1
              elif ! /usr/bin/sudo /usr/bin/dscl . -delete "$review_group_path" \
                || /usr/bin/sudo /usr/bin/dscl . -read "$review_group_path" >/dev/null 2>&1; then
                echo "::error::Ephemeral review group cleanup failed; retained until runner disposal: name=$review_group gid=$review_gid"
                cleanup_status=1
              else
                review_group_created=false
              fi
            fi
            if (( primary_status != 0 )); then
              exit "$primary_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup_review_account EXIT
          review_local_user_names=""
          review_local_group_names=""
          review_local_user_ids=""
          review_local_group_ids=""
          review_cached_user_name=""
          review_cached_group_name=""
          if ! review_local_user_names="$(/usr/bin/sudo /usr/bin/dscl . -list /Users)" \
            || ! review_local_group_names="$(/usr/bin/sudo /usr/bin/dscl . -list /Groups)" \
            || ! review_local_user_ids="$(/usr/bin/sudo /usr/bin/dscl . -list /Users UniqueID)" \
            || ! review_local_group_ids="$(/usr/bin/sudo /usr/bin/dscl . -list /Groups PrimaryGroupID)" \
            || ! review_cached_user_name="$(/usr/bin/dscacheutil -q user -a name "$review_user")" \
            || ! review_cached_group_name="$(/usr/bin/dscacheutil -q group -a name "$review_group")"; then
            echo "::error::Ephemeral review account directory inventory is unavailable; retained at $isolated_root"
            exit 1
          fi
          review_local_user_name_match="$(/usr/bin/awk -v target="$review_user" '$1 == target {print $1}' <<< "$review_local_user_names")"
          review_local_group_name_match="$(/usr/bin/awk -v target="$review_group" '$1 == target {print $1}' <<< "$review_local_group_names")"
          if [[ -n "$review_cached_user_name" ]] \
            || [[ -n "$review_cached_group_name" ]] \
            || [[ -n "$review_local_user_name_match" ]] \
            || [[ -n "$review_local_group_name_match" ]] \
            || [[ ! "$review_admin_gid" =~ ^[[:digit:]]+$ ]]; then
            echo "::error::Ephemeral review account name or admin-group evidence is unavailable; retained at $isolated_root"
            exit 1
          fi
          review_id_prefix="${review_account_suffix:0:4}"
          review_id_start=$((50000 + (16#$review_id_prefix % 10000)))
          for (( review_id_offset = 0; review_id_offset < 10000; review_id_offset++ )); do
            review_id_candidate=$((50000 + ((review_id_start - 50000 + review_id_offset) % 10000)))
            review_cached_user_uid=""
            review_cached_group_gid=""
            if ! review_cached_user_uid="$(/usr/bin/dscacheutil -q user -a uid "$review_id_candidate")" \
              || ! review_cached_group_gid="$(/usr/bin/dscacheutil -q group -a gid "$review_id_candidate")"; then
              echo "::error::Ephemeral review account UID/GID lookup failed; retained at $isolated_root"
              exit 1
            fi
            review_local_user_uid_match="$(/usr/bin/awk -v target="$review_id_candidate" '$NF == target {print $1}' <<< "$review_local_user_ids")"
            review_local_group_gid_match="$(/usr/bin/awk -v target="$review_id_candidate" '$NF == target {print $1}' <<< "$review_local_group_ids")"
            if [[ -z "$review_cached_user_uid" ]] \
              && [[ -z "$review_cached_group_gid" ]] \
              && [[ -z "$review_local_user_uid_match" ]] \
              && [[ -z "$review_local_group_gid_match" ]]; then
              review_uid="$review_id_candidate"
              review_gid="$review_id_candidate"
              break
            fi
          done
          if [[ ! "$review_uid" =~ ^[[:digit:]]+$ ]] \
            || (( review_uid < 50000 || review_uid > 59999 )); then
            echo "::error::No unused ephemeral review account UID/GID is available; retained at $isolated_root"
            exit 1
          fi
          /usr/bin/sudo /usr/bin/dscl . -create "$review_group_path"
          review_group_created=true
          /usr/bin/sudo /usr/bin/dscl . -create "$review_group_path" GeneratedUID "$review_group_guid"
          if ! verify_review_record_attribute \
            group "$review_group_path" GeneratedUID "$review_group_guid"; then
            report_review_account_validation_failure
            echo "::error::Ephemeral review group origin binding failed; retained until runner disposal"
            exit 1
          fi
          review_group_origin_bound=true
          /usr/bin/sudo /usr/bin/dscl . -create "$review_group_path" PrimaryGroupID "$review_gid"
          /usr/bin/sudo /usr/bin/dscl . -create "$review_group_path" RealName "Codex Review CI"
          /usr/bin/sudo /usr/bin/dscl . -create "$review_user_path"
          review_user_created=true
          /usr/bin/sudo /usr/bin/dscl . -create "$review_user_path" GeneratedUID "$review_user_guid"
          if ! verify_review_record_attribute \
            user "$review_user_path" GeneratedUID "$review_user_guid"; then
            report_review_account_validation_failure
            echo "::error::Ephemeral review user origin binding failed; retained until runner disposal"
            exit 1
          fi
          review_user_origin_bound=true
          /usr/bin/sudo /usr/bin/dscl . -create "$review_user_path" UniqueID "$review_uid"
          /usr/bin/sudo /usr/bin/dscl . -create "$review_user_path" PrimaryGroupID "$review_gid"
          /usr/bin/sudo /usr/bin/dscl . -create "$review_user_path" NFSHomeDirectory /var/empty
          /usr/bin/sudo /usr/bin/dscl . -create "$review_user_path" UserShell /usr/bin/false
          /usr/bin/sudo /usr/bin/dscl . -create \
            "$review_user_path" dsAttrTypeNative:IsHidden 1
          /usr/bin/sudo /usr/bin/dscl . -create "$review_user_path" AuthenticationAuthority ";DisabledUser;"
          /usr/bin/sudo /usr/bin/dscl . -create "$review_user_path" Password '*'
          /usr/bin/sudo /usr/bin/dscacheutil -flushcache
          if ! verify_review_account; then
            report_review_account_validation_failure
            echo "::error::Ephemeral review account failed identity or non-admin validation; retained until runner disposal"
            exit 1
          fi
          review_account_receipt="$(/usr/bin/printf '%s\0' \
            hosted-review-account-v1 \
            "$review_user" "$review_uid" "$review_gid" \
            "$review_user_guid" "$review_group_guid" \
            | /usr/bin/shasum -a 256 | /usr/bin/awk '{print $1}')"
          if [[ ! "$review_account_receipt" =~ ^[[:xdigit:]]{64}$ ]]; then
            /usr/bin/printf '%s\n' "::error::Ephemeral review account receipt is malformed"
            exit 1
          fi
          review_processes_preuse="$(review_account_processes)"
          if [[ -n "$review_processes_preuse" ]]; then
            echo "::error::Ephemeral review account is already in use; retained until runner disposal: pids=${review_processes_preuse//$'\n'/,}"
            exit 1
          fi
          review_account_custody_active=true
          echo "Ephemeral review account: name=$review_user uid=$review_uid gid=$review_gid user_guid=$review_user_guid group_guid=$review_group_guid"
          /usr/bin/sudo /bin/mkdir -m 0700 "$isolated_root/payload"
          /usr/bin/sudo /usr/sbin/chown "$review_user:$review_group" "$isolated_root/payload"
          run_review_user /bin/test ! -w /private
          run_review_user /bin/test ! -w "$isolated_root"
          run_review_user /bin/test -x "$isolated_python"
          run_review_user /bin/test ! -w "$managed_python_dir"
          run_review_user /bin/test ! -w "$runtime_root"
          run_review_user /bin/test -r "$isolated_source/tests/trusted_mac_gate.py"
          run_review_user /bin/test -r "$isolated_source/tests/run_readonly_install_deterministic_supervisor.py"
          run_review_user /bin/test ! -w "$isolated_source"
          prequery_developer_dir_physical="$(cd "$DEVELOPER_DIR" && pwd -P)"
          prequery_direct_git_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp:%z:%l' "$direct_git")"
          prequery_direct_git_digest="$(/usr/bin/shasum -a 256 "$direct_git")"
          prequery_direct_git_digest="${prequery_direct_git_digest%% *}"
          prequery_direct_git_exec_path_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp' "$direct_git_exec_path")"
          prequery_checkout_git_dir_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp' "$checkout_git_dir")"
          prequery_checkout_git_objects_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp' "$checkout_git_objects")"
          prequery_checkout_head_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp:%z' "$checkout_head_file")"
          prequery_checkout_head_sha="$(/bin/cat "$checkout_head_file")"
          prequery_checkout_bootstrap_root_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp' "$checkout_bootstrap_root")"
          prequery_checkout_git_control_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp' "$checkout_git_control")"
