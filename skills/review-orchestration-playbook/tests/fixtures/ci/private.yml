name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  platform_tests:
    name: platform-tests (${{ matrix.os }})
    needs:
      - python-39-compatibility
      - platform-safety
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1; python_version < "3.11"'
      - name: Install Linux isolation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap gcc ripgrep socat
      - name: Enable unprivileged user namespaces for Linux isolation test
        if: runner.os == 'Linux'
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check synced review helper syntax without bytecode
        run: |
          python3 -B -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]' \
            personal_codex/skills/review-orchestration-playbook/scripts/isolated_review \
            personal_codex/skills/review-orchestration-playbook/scripts/named_claude_preflight \
            personal_codex/skills/review-orchestration-playbook/scripts/named_lane_guard \
            personal_codex/skills/review-orchestration-playbook/scripts/validate_claude_stream.py \
            personal_codex/skills/review-orchestration-playbook/scripts/review_runtime/*.py
      - name: Check Linux launcher C syntax
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -fsyntax-only personal_codex/skills/review-orchestration-playbook/scripts/review_runtime/claude_linux_launcher.c
      - name: Verify canonical review workflow
        run: |
          python3 -m unittest discover \
            -s personal_codex/skills/review-orchestration-playbook/tests \
            -p 'test_*.py'
      - name: Verify private overlay sync on macOS
        if: runner.os == 'macOS'
        run: |
          python3 -m unittest discover \
            -s tests \
            -p 'test_private_overlay_sync.py'
      - name: Run real Linux isolation integration test
        if: runner.os == 'Linux'
        env:
          CODEX_REVIEW_RUN_LINUX_ISOLATION_INTEGRATION: "1"
        run: |
          python3 -m unittest -v personal_codex/skills/review-orchestration-playbook/tests/test_claude_linux.py
      - name: Check private overlay helper syntax without bytecode
        if: runner.os == 'Linux'
        run: |
          python3 -B -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]' \
            scripts/codex_personal_sync.py \
            scripts/build_personal_codex_package.py \
            scripts/validate_sync_manifest_changes.py \
            scripts/private_overlay_release.py \
            scripts/sync_private_overlay_sources.py \
            tests/test_private_overlay_package.py \
            tests/test_private_overlay_sync.py \
            tests/test_sync_manifest_changes.py
      - name: Build and verify private overlay
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s tests
      - name: Validate sync manifest changes
        if: runner.os == 'Linux'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate_sync_manifest_changes.py --base-ref "$BASE_REF"
      - name: Verify waited-delivery review contract
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover \
            -s personal_codex/skills/waited-delivery/tests \
            -p 'test_*.py'
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  broker_reproducibility:
    name: broker-reproducibility (macos-26)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require hosted-runner byte reproduction
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          /bin/bash \
            personal_codex/skills/review-orchestration-playbook/scripts/build_claude_keychain_broker_macos.sh \
            --check

  independent_supervisor_tests:
    name: independent-supervisor (python-3.13)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check independent review supervisor syntax without bytecode
        working-directory: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        run: |
          python3 -B -c 'import pathlib; paths = [pathlib.Path("independent-codex-pr-review"), *sorted(pathlib.Path("review_supervisor").rglob("*.py"))]; [compile(path.read_bytes(), str(path), "exec") for path in paths]'
      - name: Report hosted no-child runtime fingerprint
        run: |
          /usr/bin/sw_vers -productVersion
          /usr/bin/sw_vers -buildVersion
          /usr/bin/uname -r
          /usr/bin/uname -m
          /usr/bin/shasum -a 256 /usr/bin/sandbox-exec
      - name: Match hosted no-child blocker signature
        working-directory: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        env:
          CODEX_REVIEW_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CODEX_REVIEW_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          python3 -m tests.run_hosted_no_child_fail_closed
      - name: Run deterministic independent supervisor tests
        working-directory: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        env:
          CODEX_REVIEW_TEST_RUNTIME_PARENT: ${{ runner.temp }}
        run: |
          python3 -m tests.run_required_deterministic_supervisor
      - name: Verify installed release tree remains immutable
        working-directory: personal_codex/skills/review-orchestration-playbook/tests
        run: |
          python3 -m unittest -v test_contracts.RepositoryContractTest.test_installed_supervisor_preflight_keeps_release_tree_immutable
      - name: Verify independent review supervisor CLI
        working-directory: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        run: |
          python3 independent-codex-pr-review --help
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  readonly_install_supervisor_tests:
    name: read-only-install-supervisor (python-3.13)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned uv
        id: setup-uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          enable-cache: false
      - name: Run deterministic supervisor from read-only install
        env:
          REVIEW_SOURCE_RELATIVE: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
          UV_EXECUTABLE: ${{ steps.setup-uv.outputs.uv-path }}
        run: |
          isolated_root="$(/usr/bin/sudo /usr/bin/mktemp -d /private/codex-review-readonly.XXXXXX)"
          echo "Read-only isolation recovery root: $isolated_root"
          if [[ ! "$isolated_root" =~ ^/private/codex-review-readonly\.[[:alnum:]]{6}$ ]]; then
            echo "::error::Refusing an unexpected isolation root; retained at $isolated_root"
            exit 1
          fi
          /usr/bin/sudo /bin/chmod -N "$isolated_root"
          /usr/bin/sudo /bin/test -d "$isolated_root"
          /usr/bin/sudo /bin/test ! -L "$isolated_root"
          isolated_object_id="$(/usr/bin/sudo /usr/bin/stat -f '%d:%i' "$isolated_root")"
          test "$(/usr/bin/sudo /usr/bin/stat -f '%u' "$isolated_root")" = "0"
          test "$(/usr/bin/sudo /usr/bin/stat -f '%Lp' "$isolated_root")" = "700"
          uv_root_home="$isolated_root/uv-home"
          /usr/bin/sudo /bin/mkdir -m 0700 "$uv_root_home"
          test "$(/usr/bin/sudo /usr/bin/stat -f '%u' "$uv_root_home")" = "0"
          test "$(/usr/bin/sudo /usr/bin/stat -f '%Lp' "$uv_root_home")" = "700"
          uv_root_tmp="$uv_root_home/tmp"
          /usr/bin/sudo /bin/mkdir -m 0700 "$uv_root_tmp"
          test "$(/usr/bin/sudo /usr/bin/stat -f '%u' "$uv_root_tmp")" = "0"
          test "$(/usr/bin/sudo /usr/bin/stat -f '%Lp' "$uv_root_tmp")" = "700"
          trusted_uv_candidate="$UV_EXECUTABLE"
          trusted_uv=""
          if [[ "$trusted_uv_candidate" == /* ]] \
            && ! /bin/test -L "$trusted_uv_candidate"; then
            trusted_uv="$(cd "$(/usr/bin/dirname "$trusted_uv_candidate")" && pwd -P)/$(/usr/bin/basename "$trusted_uv_candidate")" \
              || trusted_uv=""
          fi
          run_trusted_uv() {
            /usr/bin/sudo /usr/bin/env -i \
              HOME="$uv_root_home" \
              LANG=C \
              LC_ALL=C \
              PATH=/usr/bin:/bin \
              TMPDIR="$uv_root_tmp" \
              "$trusted_uv" "$@"
          }
          if [[ -z "$trusted_uv" ]] \
            || ! /bin/test -f "$trusted_uv" \
            || /bin/test -L "$trusted_uv" \
            || [[ "$(run_trusted_uv self version --short)" != "0.11.18" ]]; then
            echo "::error::Pinned setup-uv executable is not the expected physical uv 0.11.18; retained at $isolated_root"
            exit 1
          fi
          trusted_uv_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp:%z:%m' "$trusted_uv")"
          trusted_uv_digest="$(/usr/bin/shasum -a 256 "$trusted_uv")"
          trusted_uv_digest="${trusted_uv_digest%% *}"
          if [[ ! "$trusted_uv_digest" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Pinned setup-uv executable digest is invalid; retained at $isolated_root"
            exit 1
          fi
          uv_staging_dir="$isolated_root/uv-managed-staging"
          /usr/bin/sudo /bin/mkdir -m 0700 "$uv_staging_dir"
          run_trusted_uv python install 3.13.13 \
            --managed-python \
            --install-dir "$uv_staging_dir" \
            --no-bin \
            --no-cache \
            --no-progress \
            --no-config
          trusted_uv_postinstall_binding="$(/usr/bin/stat -f '%d:%i:%u:%g:%Lp:%z:%m' "$trusted_uv")"
          trusted_uv_postinstall_digest="$(/usr/bin/shasum -a 256 "$trusted_uv")"
          trusted_uv_postinstall_digest="${trusted_uv_postinstall_digest%% *}"
          if [[ "$trusted_uv_postinstall_binding" != "$trusted_uv_binding" ]] \
            || [[ "$trusted_uv_postinstall_digest" != "$trusted_uv_digest" ]] \
            || [[ "$(run_trusted_uv self version --short)" != "0.11.18" ]]; then
            echo "::error::Pinned setup-uv executable changed while installing Python; retained at $isolated_root"
            exit 1
          fi
          staged_runtime_root=""
          staged_runtime_count=0
          for runtime_candidate in \
            "$uv_staging_dir/cpython-3.13.13-macos-aarch64-none" \
            "$uv_staging_dir/cpython-3.13.13-macos-x86_64-none"; do
            if /usr/bin/sudo /bin/test -e "$runtime_candidate" \
              || /usr/bin/sudo /bin/test -L "$runtime_candidate"; then
              staged_runtime_root="$runtime_candidate"
              (( staged_runtime_count += 1 ))
            fi
          done
          staged_runtime_alias=""
          staged_runtime_alias_count=0
          for runtime_alias_candidate in \
            "$uv_staging_dir/cpython-3.13-macos-aarch64-none" \
            "$uv_staging_dir/cpython-3.13-macos-x86_64-none"; do
            if /usr/bin/sudo /bin/test -e "$runtime_alias_candidate" \
              || /usr/bin/sudo /bin/test -L "$runtime_alias_candidate"; then
              staged_runtime_alias="$runtime_alias_candidate"
              (( staged_runtime_alias_count += 1 ))
            fi
          done
          staged_runtime_alias_target=""
          if (( staged_runtime_alias_count == 1 )) \
            && /usr/bin/sudo /bin/test -L "$staged_runtime_alias"; then
            staged_runtime_alias_target="$(/usr/bin/sudo /usr/bin/readlink "$staged_runtime_alias")" \
              || staged_runtime_alias_target="<unreadable>"
          fi
          staging_unexpected_entry=""
          staging_unexpected_entry="$(/usr/bin/sudo /usr/bin/find "$uv_staging_dir" \
            -mindepth 1 -maxdepth 1 \
            ! -name '.lock' \
            ! -name '.temp' \
            ! -name '.gitignore' \
            ! -name 'cpython-3.13-macos-aarch64-none' \
            ! -name 'cpython-3.13-macos-x86_64-none' \
            ! -name 'cpython-3.13.13-macos-aarch64-none' \
            ! -name 'cpython-3.13.13-macos-x86_64-none' \
            -print -quit)" || staging_unexpected_entry="<unreadable>"
          staging_temp_entry=""
          staging_temp_entry="$(/usr/bin/sudo /usr/bin/find "$uv_staging_dir/.temp" \
            -mindepth 1 -print -quit)" || staging_temp_entry="<unreadable>"
          if (( staged_runtime_count != 1 )) \
            || (( staged_runtime_alias_count != 1 )) \
            || ! /usr/bin/sudo /bin/test -L "$staged_runtime_alias" \
            || [[ "$staged_runtime_alias_target" != "$staged_runtime_root" ]] \
            || [[ -n "$staging_unexpected_entry" ]] \
            || ! /usr/bin/sudo /bin/test -f "$uv_staging_dir/.lock" \
            || /usr/bin/sudo /bin/test -L "$uv_staging_dir/.lock" \
            || [[ "$(/usr/bin/sudo /usr/bin/stat -f '%z' "$uv_staging_dir/.lock")" != "0" ]] \
            || ! /usr/bin/sudo /bin/test -d "$uv_staging_dir/.temp" \
            || /usr/bin/sudo /bin/test -L "$uv_staging_dir/.temp" \
            || [[ -n "$staging_temp_entry" ]] \
            || ! /usr/bin/sudo /bin/test -f "$uv_staging_dir/.gitignore" \
            || /usr/bin/sudo /bin/test -L "$uv_staging_dir/.gitignore" \
            || [[ "$(/usr/bin/sudo /usr/bin/stat -f '%z' "$uv_staging_dir/.gitignore")" != "1" ]] \
            || [[ "$(/usr/bin/sudo /bin/cat "$uv_staging_dir/.gitignore")" != "*" ]]; then
            echo "::error::uv staging inventory is not the exact v0.11.18 managed-Python layout; retained at $isolated_root"
            exit 1
          fi
          staged_runtime_root_physical="$(/usr/bin/sudo /bin/sh -c 'cd "$1" && pwd -P' sh "$staged_runtime_root")"
          staged_runtime_root_name="$(/usr/bin/basename "$staged_runtime_root")"
          if [[ "$staged_runtime_root_physical" != "$staged_runtime_root" ]] \
            || [[ ! "$staged_runtime_root_name" =~ ^cpython-3\.13\.13-macos-(aarch64|x86_64)-none$ ]] \
            || ! /usr/bin/sudo /bin/test -d "$staged_runtime_root" \
            || /usr/bin/sudo /bin/test -L "$staged_runtime_root"; then
            echo "::error::uv staged Python root has an unexpected identity; retained at $isolated_root"
            exit 1
          fi
          managed_python_dir="$isolated_root/managed-python"
          /usr/bin/sudo /bin/mkdir -m 0700 "$managed_python_dir"
          runtime_root="$managed_python_dir/$staged_runtime_root_name"
          /usr/bin/sudo /bin/mv "$staged_runtime_root" "$runtime_root"
          /usr/bin/sudo /bin/rm "$staged_runtime_alias" \
            "$uv_staging_dir/.lock" "$uv_staging_dir/.gitignore"
          /usr/bin/sudo /bin/rmdir "$uv_staging_dir/.temp" "$uv_staging_dir"
          if /usr/bin/sudo /bin/test -e "$uv_staging_dir" \
            || /usr/bin/sudo /bin/test -L "$uv_staging_dir"; then
            echo "::error::uv staging cleanup is incomplete; retained at $isolated_root"
            exit 1
          fi
          managed_python_unexpected_entry=""
          managed_python_unexpected_entry="$(/usr/bin/sudo /usr/bin/find "$managed_python_dir" \
            -mindepth 1 -maxdepth 1 \
            ! -name "$staged_runtime_root_name" -print -quit)" \
            || managed_python_unexpected_entry="<unreadable>"
          if [[ -n "$managed_python_unexpected_entry" ]] \
            || ! /usr/bin/sudo /bin/test -d "$runtime_root" \
            || /usr/bin/sudo /bin/test -L "$runtime_root"; then
            echo "::error::Final managed-Python parent does not contain exactly one versioned physical root; retained at $isolated_root"
            exit 1
          fi
          runtime_root_physical="$(/usr/bin/sudo /bin/sh -c 'cd "$1" && pwd -P' sh "$runtime_root")"
          runtime_root_parent="$(/usr/bin/sudo /bin/sh -c 'cd "$1/.." && pwd -P' sh "$runtime_root")"
          runtime_root_name="$(/usr/bin/basename "$runtime_root")"
          if [[ "$runtime_root_physical" != "$runtime_root" ]] \
            || [[ "$runtime_root_parent" != "$managed_python_dir" ]] \
            || [[ ! "$runtime_root_name" =~ ^cpython-3\.13\.13-macos-(aarch64|x86_64)-none$ ]] \
            || ! /usr/bin/sudo /bin/test -d "$runtime_root" \
            || /usr/bin/sudo /bin/test -L "$runtime_root"; then
            echo "::error::uv managed Python root has an unexpected identity or layout; retained at $isolated_root"
            exit 1
          fi
          isolated_python="$runtime_root/bin/python3.13"
          if ! /usr/bin/sudo /bin/test -f "$isolated_python" \
            || /usr/bin/sudo /bin/test -L "$isolated_python" \
            || [[ "$(/usr/bin/sudo /usr/bin/stat -f '%HT:%l' "$isolated_python")" != "Regular File:1" ]]; then
            echo "::error::uv managed Python interpreter is not a singly linked regular file; retained at $isolated_root"
            exit 1
          fi
          runtime_special="$(/usr/bin/sudo /usr/bin/find "$runtime_root" ! -type d ! -type f ! -type l -print -quit)"
          runtime_hardlink="$(/usr/bin/sudo /usr/bin/find "$runtime_root" -type f -links +1 -print -quit)"
          if [[ -n "$runtime_special" ]] \
            || [[ -n "$runtime_hardlink" ]]; then
            echo "::error::uv managed Python contains a special file or external hardlink alias; retained at $isolated_root"
            exit 1
          fi
          runtime_libraries="$(/usr/bin/sudo /usr/bin/otool -L "$isolated_python" | /usr/bin/sed -n '2,$p')"
          runtime_library_violation="$(/usr/bin/printf '%s\n' "$runtime_libraries" | /usr/bin/awk '{print $1}' | /usr/bin/awk '$0 !~ "^/System/" && $0 !~ "^/usr/lib/" && !found {print; found = 1}')"
          runtime_rpaths="$(/usr/bin/sudo /usr/bin/otool -l "$isolated_python" | /usr/bin/awk '$1 == "cmd" && $2 == "LC_RPATH" {want = 1; next} want && $1 == "path" {print $2; want = 0}')"
          if [[ -z "$runtime_libraries" ]] \
            || [[ -n "$runtime_library_violation" ]] \
            || [[ "$runtime_rpaths" != "@executable_path/../lib" ]]; then
            echo "::error::uv managed Python has an external non-system Mach-O dependency; retained at $isolated_root"
            exit 1
          fi
          compute_runtime_loader_binding() {
            {
              /usr/bin/sudo /usr/bin/otool -L "$isolated_python"
              /usr/bin/sudo /usr/bin/otool -l "$isolated_python"
            } | /usr/bin/shasum -a 256 | /usr/bin/awk '{print $1}'
          }
          compute_runtime_symlink_binding() {
            /usr/bin/sudo /usr/bin/env -i PYTHONDONTWRITEBYTECODE=1 \
              "$isolated_python" -I -B -S -c 'import hashlib, os, pathlib, sys; root = pathlib.Path(sys.argv[1]).resolve(strict=True); links = sorted((path for path in root.rglob("*") if path.is_symlink()), key=lambda path: os.fsencode(str(path.relative_to(root)))); resolved = [(path, path.resolve(strict=True)) for path in links]; escaped = [(path, target) for path, target in resolved if target != root and root not in target.parents]; records = [os.fsencode(str(path.relative_to(root))) + b"\0" + os.fsencode(os.readlink(path)) + b"\0" for path in links]; sys.exit("runtime symlink escapes versioned root: " + ", ".join(str(path) for path, _ in escaped[:10])) if escaped else print(f"{len(links)}:{hashlib.sha256(b"".join(records)).hexdigest()}")' \
              "$runtime_root"
          }
          compute_runtime_tree_binding() {
            /usr/bin/sudo /usr/bin/env -i PYTHONDONTWRITEBYTECODE=1 \
              "$isolated_python" -I -B -S -c 'import hashlib, os, pathlib, stat, sys; root = pathlib.Path(sys.argv[1]).resolve(strict=True); entries = sorted(((path, path.lstat()) for path in [root, *root.rglob("*")]), key=lambda item: os.fsencode(str(item[0].relative_to(root)))); special = [path for path, metadata in entries if not (stat.S_ISDIR(metadata.st_mode) or stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode))]; content = [os.fsencode(str(path.relative_to(root))) + b"\0" + (b"D" if stat.S_ISDIR(metadata.st_mode) else b"L" + os.fsencode(os.readlink(path)) if stat.S_ISLNK(metadata.st_mode) else b"F" + hashlib.sha256(path.read_bytes()).digest()) + b"\0" for path, metadata in entries]; identity = [os.fsencode(str(path.relative_to(root))) + b"\0" + f"{metadata.st_dev}:{metadata.st_ino}:{stat.S_IFMT(metadata.st_mode)}:{metadata.st_uid}:{metadata.st_gid}:{stat.S_IMODE(metadata.st_mode)}:{getattr(metadata, "st_flags", 0)}:{metadata.st_nlink}".encode() + b"\0" for path, metadata in entries]; sys.exit("special runtime entry: " + ", ".join(str(path) for path in special[:10])) if special else print(hashlib.sha256(b"".join(content)).hexdigest() + ":" + hashlib.sha256(b"".join(identity)).hexdigest())' \
              "$runtime_root"
          }
          probe_runtime_identity() {
            /usr/bin/sudo /usr/bin/env -i PYTHONDONTWRITEBYTECODE=1 \
              "$isolated_python" -I -B -S -c 'import os, sys; print("|".join((f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}", os.path.realpath(sys.executable), os.path.realpath(sys.prefix), os.path.realpath(sys.base_prefix))))'
          }
          runtime_symlink_binding="$(compute_runtime_symlink_binding)"
          runtime_identity="$(probe_runtime_identity)"
          if [[ "$runtime_identity" != "3.13.13|$isolated_python|$runtime_root|$runtime_root" ]]; then
            echo "::error::uv managed Python did not self-identify as the isolated exact runtime; retained at $isolated_root"
            exit 1
          fi
          /usr/bin/sudo /usr/sbin/chown -R root:wheel "$managed_python_dir"
          /usr/bin/sudo /bin/chmod -RN "$managed_python_dir"
          /usr/bin/sudo /usr/bin/xattr -cr "$managed_python_dir"
          /usr/bin/sudo /bin/chmod -R a+rX,a-w "$managed_python_dir"
          runtime_root_binding="$(/usr/bin/sudo /usr/bin/stat -f '%d:%i:%u:%g:%Lp' "$runtime_root")"
          isolated_python_binding="$(/usr/bin/sudo /usr/bin/stat -f '%d:%i:%u:%g:%Lp:%z:%l' "$isolated_python")"
          isolated_python_digest="$(/usr/bin/sudo /usr/bin/shasum -a 256 "$isolated_python")"
          isolated_python_digest="${isolated_python_digest%% *}"
          runtime_loader_binding="$(compute_runtime_loader_binding)"
          runtime_tree_binding="$(compute_runtime_tree_binding)"
          test "$(/usr/bin/sudo /usr/bin/stat -f '%u:%g:%Lp' "$managed_python_dir")" = "0:0:555"
