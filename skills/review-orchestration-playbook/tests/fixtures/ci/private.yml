              || [[ -n "$current_runtime_write_violation" ]] \
              || [[ -n "$current_runtime_read_violation" ]] \
              || [[ -n "$current_runtime_traverse_violation" ]] \
              || [[ -n "$current_runtime_xattr_violation" ]] \
              || [[ -n "$current_runtime_acl_violation" ]] \
