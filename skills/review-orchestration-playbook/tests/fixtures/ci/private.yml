name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  classify_changes:
    name: classify-private-ci-changes
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_LINUX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      runtime_matrix_required: ${{ steps.classify.outputs.runtime_matrix_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Classify the frozen candidate with trusted base code
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          unset GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1
          export GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0
          classification_root="$(mktemp -d "$RUNNER_TEMP/private-ci-classification.XXXXXX")"
          trap 'rm -rf "$classification_root"' EXIT
          classifier_path="scripts/classify_private_ci_changes.py"
          entry="$(git --no-replace-objects ls-tree "$BASE_SHA" -- "$classifier_path" 2>/dev/null || true)"
          metadata=""; path=""
          IFS=$'\t' read -r metadata path <<< "$entry" || true
          mode=""; kind=""; object_id=""
          IFS=' ' read -r mode kind object_id <<< "$metadata" || true
          if [[ "$path" == "$classifier_path" && "$mode" == "100644" && "$kind" == "blob" && "$object_id" =~ ^[0-9a-f]{40}$ ]]; then
            if git --no-replace-objects show "$BASE_SHA:$classifier_path" > "$classification_root/classifier.py" \
              && python3 -I -B "$classification_root/classifier.py" \
              --repo-root "$GITHUB_WORKSPACE" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
              --github-output "$classification_root/decision"; then
              if printf '%s\n' 'runtime_matrix_required=false' | cmp -s - "$classification_root/decision"; then
                echo 'runtime_matrix_required=false' >> "$GITHUB_OUTPUT"
                exit 0
              elif printf '%s\n' 'runtime_matrix_required=true' | cmp -s - "$classification_root/decision"; then
                echo 'runtime_matrix_required=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo 'Trusted classification unavailable; running the full runtime matrix.'
          echo 'runtime_matrix_required=true' >> "$GITHUB_OUTPUT"

  source_admission_tests:
    name: source-lock-admission-and-package
    needs: classify_changes
    if: ${{ needs.classify_changes.outputs.runtime_matrix_required == 'false' }}
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_LINUX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate source admission and package behavior
        run: |
          python3 -B scripts/private_overlay_source_lock.py emit-github-outputs
          python3 -B -m unittest \
            tests.test_private_ci_change_classification \
            tests.test_private_ci_results \
            tests.test_private_overlay_source_lock \
            tests.test_generated_sync_source_lock \
            tests.test_private_overlay_package \
            tests.test_package_builder_safety
      - name: Build and verify the exact candidate package
        run: |
          python3 -B scripts/build_personal_codex_package.py \
            --sha "$GITHUB_SHA" --require-clean-sources \
            --output-dir "$RUNNER_TEMP/source-admission-dist"
          python3 -B scripts/private_overlay_release.py verify-package \
            --sha "$GITHUB_SHA" --dist "$RUNNER_TEMP/source-admission-dist"

  review_syntax_tests:
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    name: review-syntax (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ fromJSON(startsWith(matrix.os, 'macos') && (vars.CODEX_PRIVATE_MACOS_RUNNER_LABELS || '["macos-latest"]') || (vars.CODEX_PRIVATE_LINUX_RUNNER_LABELS || '["ubuntu-latest"]')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check synced review helper syntax without bytecode
        run: |
          python3 -B -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]' \
            personal_codex/skills/review-orchestration-playbook/scripts/isolated_review \
            personal_codex/skills/review-orchestration-playbook/scripts/named_claude_preflight \
            personal_codex/skills/review-orchestration-playbook/scripts/named_lane_guard \
            personal_codex/skills/review-orchestration-playbook/scripts/validate_claude_stream.py \
            personal_codex/skills/review-orchestration-playbook/scripts/review_runtime/*.py
      - name: Check Linux launcher C syntax
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -fsyntax-only personal_codex/skills/review-orchestration-playbook/scripts/review_runtime/claude_linux_launcher.c
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  review_tests:
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    name: review-tests (${{ matrix.os }}, ${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        module:
          - test_claude_capabilities.py
          - test_claude_linux.py
          - test_claude_provenance.py
          - test_claude_refresh_lock.py
          - test_cli.py
          - test_common.py
          - test_contracts.py
          - test_fd_exec.py
          - test_github_recovery_contracts.py
          - test_github_terminal_carriers.py
          - test_installer.py
          - test_local_codex_lane_contracts.py
          - test_named_claude_preflight.py
          - test_named_lane.py
          - test_providers.py
          - test_readiness_plan.py
          - test_review_result.py
          - test_review_workspace.py
          - test_state.py
          - test_synthetic_tokens.py
          - test_trusted_mac_gate_manifest.py
          - test_validate_claude_stream.py
          - test_workspace.py
        exclude:
          - os: macos-latest
            module: test_claude_provenance.py
          - os: macos-latest
            module: test_claude_refresh_lock.py
          - os: macos-latest
            module: test_named_lane.py
          - os: macos-latest
            module: test_providers.py
          - os: macos-latest
            module: test_review_workspace.py
          - os: macos-latest
            module: test_state.py
          - os: macos-latest
            module: test_synthetic_tokens.py
          - os: macos-latest
            module: test_validate_claude_stream.py
          - os: macos-latest
            module: test_workspace.py
    runs-on: ${{ fromJSON(startsWith(matrix.os, 'macos') && (vars.CODEX_PRIVATE_MACOS_RUNNER_LABELS || '["macos-latest"]') || (vars.CODEX_PRIVATE_LINUX_RUNNER_LABELS || '["ubuntu-latest"]')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1; python_version < "3.11"'
      - name: Run review test module
        run: python3 -m unittest "personal_codex/skills/review-orchestration-playbook/tests/${{ matrix.module }}"
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  review_macos_shard_tests:
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    name: review-macos-shards (${{ matrix.module }}, shard ${{ matrix.shard }}/${{ matrix.shard_count }})
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - module: test_named_lane.py
            shard: 0
            shard_count: 4
          - module: test_named_lane.py
            shard: 1
            shard_count: 4
          - module: test_named_lane.py
            shard: 2
            shard_count: 4
          - module: test_named_lane.py
            shard: 3
            shard_count: 4
          - module: test_providers.py
            shard: 0
            shard_count: 2
          - module: test_providers.py
            shard: 1
            shard_count: 2
          - module: test_review_workspace.py
            shard: 0
            shard_count: 2
          - module: test_review_workspace.py
            shard: 1
            shard_count: 2
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_MACOS_RUNNER_LABELS || '["macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1; python_version < "3.11"'
      - name: Run review test shard
        run: |
          python3 -B scripts/run_unittest_shard.py \
            "personal_codex/skills/review-orchestration-playbook/tests/${{ matrix.module }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ matrix.shard_count }}"
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  review_macos_native_tests:
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    name: review-macos-native
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_MACOS_RUNNER_LABELS || '["macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1; python_version < "3.11"'
      - name: Run Darwin path and filesystem cases
        env:
          PYTHONPATH: personal_codex/skills/review-orchestration-playbook/tests
        run: |
          python3 -B -m unittest \
            test_claude_refresh_lock.ClaudeRefreshLockTest.test_background_heartbeat_renews_slow_critical_section_and_stops \
            test_claude_refresh_lock.ClaudeRefreshLockTest.test_synchronous_renewal_detects_post_utime_identity_compromise \
            test_state.StatefulLifecycleTest.test_cleanup_rejects_lock_path_replacement_after_flock \
            test_state.StatefulLifecycleTest.test_runner_lock_probe_rejects_fifo_without_blocking \
            test_state.StatefulLifecycleTest.test_runner_lock_probe_rejects_path_swap_after_open \
            test_synthetic_tokens.CatalogValidationTest.test_secure_loader_rejects_symlink_hardlink_fifo_and_writable_file \
            test_validate_claude_stream.ClaudeStreamValidatorTest.test_fifo_contract_inputs_fail_closed_without_blocking \
            test_validate_claude_stream.ClaudeStreamValidatorTest.test_blocks_inside_symlink_that_resolves_outside_workspace \
            test_validate_claude_stream.ClaudeStreamValidatorTest.test_named_direct_opens_and_closes_one_workspace_binding_per_stream \
            test_workspace.WorkspaceTest.test_wip_overlay_batches_raw_paths_without_per_path_git_processes \
            test_workspace.WorkspaceTest.test_wip_tracked_raw_path_round_trips_name_status_pair
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  project_journal_tests:
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    name: project-journal-tests (${{ matrix.os }}, ${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        module:
          - test_project_journal.py
    runs-on: ${{ fromJSON(startsWith(matrix.os, 'macos') && (vars.CODEX_PRIVATE_MACOS_RUNNER_LABELS || '["macos-latest"]') || (vars.CODEX_PRIVATE_LINUX_RUNNER_LABELS || '["ubuntu-latest"]')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1; python_version < "3.11"'
      - name: Verify canonical project journal workflow
        run: python3 -m unittest "personal_codex/skills/project-journal/tests/${{ matrix.module }}"
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  linux_isolation_tests:
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    name: linux-isolation-tests
    # Persistent hosts provide isolation; disposable hosted runners retain namespace setup.
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_LINUX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1; python_version < "3.11"'
      - name: Install Linux isolation dependencies
        run: |
          missing_tools=()
          for tool in bwrap gcc rg socat; do
            command -v "$tool" >/dev/null || missing_tools+=("$tool")
          done
          if (( ${#missing_tools[@]} )); then
            printf 'Missing isolation tools: %s\n' "${missing_tools[*]}"
            command -v apt-get >/dev/null
            sudo -n apt-get update
            sudo -n apt-get install --yes bubblewrap gcc ripgrep socat
          fi
      - name: Prepare namespaces on disposable hosted runner
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run real Linux isolation integration test
        env:
          CODEX_REVIEW_RUN_LINUX_ISOLATION_INTEGRATION: "1"
        run: python3 -m unittest -v personal_codex/skills/review-orchestration-playbook/tests/test_claude_linux.py
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  private_overlay_tests:
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    name: private-overlay-tests (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module:
          - test_cisco_ghe_probe.py
          - test_codex_personal_sync.py
          - test_generated_sync_source_lock.py
          - test_jira_issue_probe.py
          - test_macos_ci_fixture_bootstrap.py
          - test_macos_ci_readonly_fixture.py
          - test_macos_ci_vm_supervisor.py
          - test_package_builder_safety.py
          - test_pending_agent_claim_compatibility.py
          - test_pending_staging_cleanup.py
          - test_personal_sync_reconciliation_safety.py
          - test_pr_attribution.py
          - test_private_ci_change_classification.py
          - test_private_ci_results.py
          - test_private_macos_sync_controller.py
          - test_private_overlay_package.py
          - test_private_overlay_source_lock.py
          - test_private_overlay_sync.py
          - test_private_synthetic_catalog.py
          - test_quarantine_empty_batch_reclaim.py
          - test_regular_agent_materialization.py
          - test_release_manifest_baseline.py
          - test_release_retention.py
          - test_remote_codex_probe.py
          - test_scheduler_doctor.py
          - test_skill_validator_wrapper.py
          - test_sync_manifest_changes.py
          - test_unittest_shard.py
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_LINUX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1; python_version < "3.11"'
      - name: Run private overlay test module
        run: python3 -m unittest "tests/${{ matrix.module }}"
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  private_overlay_uninstall_shard_tests:
    name: private-overlay-uninstall-shards (${{ matrix.shard }}/4)
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module:
          - test_regular_overlay_uninstall_status_regressions.py
        shard: [0, 1, 2, 3]
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_LINUX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1; python_version < "3.11"'
      - name: Run uninstall and status regression shard
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -B scripts/run_unittest_shard.py "tests/${{ matrix.module }}" \
            --shard-index "${{ matrix.shard }}" --shard-count 4
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  private_overlay_contract_tests:
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    name: private-overlay-contract-tests
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_LINUX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1; python_version < "3.11"'
      - name: Check private overlay helper syntax without bytecode
        run: |
          python3 -B -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]' \
            scripts/codex_personal_sync.py \
            scripts/build_personal_codex_package.py \
            scripts/validate_sync_manifest_changes.py \
            scripts/private_overlay_release.py \
            scripts/sync_private_overlay_sources.py \
            tests/test_private_overlay_package.py \
            tests/test_private_overlay_sync.py \
            tests/test_sync_manifest_changes.py
      - name: Validate sync manifest changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate_sync_manifest_changes.py --base-ref "$BASE_REF"
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  independent_supervisor_tests:
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    name: independent-supervisor (python-3.13)
    # Probe native isolation and preserve broker byte reproduction on either provider.
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_MACOS_RUNNER_LABELS || '["macos-26"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check independent review supervisor syntax without bytecode
        working-directory: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        run: |
          python3 -B -c 'import pathlib; paths = sorted(pathlib.Path("review_supervisor").rglob("*.py")); [compile(path.read_bytes(), str(path), "exec") for path in paths]'
      - name: Report native no-child runtime fingerprint
        run: |
          /usr/bin/sw_vers -productVersion
          /usr/bin/sw_vers -buildVersion
          /usr/bin/uname -r
          /usr/bin/uname -m
          /usr/bin/shasum -a 256 /usr/bin/sandbox-exec
      - name: Verify native no-child compatibility and refusal behavior
        working-directory: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        run: |
          python3 -m tests.run_hosted_no_child_fail_closed --native-ci
      - name: Run deterministic independent supervisor tests
        timeout-minutes: 10
        working-directory: personal_codex/skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        env:
          CODEX_REVIEW_TEST_RUNTIME_PARENT: ${{ runner.temp }}
        run: |
          python3 -m tests.run_required_deterministic_supervisor
      - uses: actions/setup-python@v5
        id: setup_latest_python
        if: always()
        timeout-minutes: 2
        with:
          python-version: "3.x"
      - name: Run platform reconciliation safety tests (Python 3.x)
        if: ${{ always() && steps.setup_latest_python.outcome == 'success' }}
        timeout-minutes: 10
        run: python3 -m unittest -v tests.test_personal_sync_reconciliation_safety
      - name: Require native broker byte reproduction
        if: always()
        timeout-minutes: 2
        run: |
          DEVELOPER_DIR="$(/usr/bin/xcode-select -p)"
          export DEVELOPER_DIR
          /bin/bash \
            personal_codex/skills/review-orchestration-playbook/scripts/build_claude_keychain_broker_macos.sh \
            --check
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  readonly_install_supervisor_tests:
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    name: read-only-install-supervisor (python-3.13)
    # Failures may retain root-owned state; a self-hosted slot must discard its guest.
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_MACOS_ISOLATED_RUNNER_LABELS || '["macos-26"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare disposable hosted fixture
        if: ${{ runner.environment == 'github-hosted' }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -eo pipefail
          bootstrap_result="$(mktemp "$RUNNER_TEMP/codex-fixture-bootstrap.XXXXXX")"
          trap '/bin/rm -f "$bootstrap_result"' EXIT
          bootstrap_status=0
          /usr/bin/sudo -n /usr/bin/env -i \
            GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            SUDO_UID="$(/usr/bin/id -u)" SUDO_GID="$(/usr/bin/id -g)" \
            /usr/bin/python3 -I -B -S "$GITHUB_WORKSPACE/scripts/bootstrap_macos_ci_fixture.py" \
            --ephemeral-bootstrap --workspace-root "$GITHUB_WORKSPACE" \
            | /usr/bin/tee "$bootstrap_result" > /dev/null || bootstrap_status=$?
          /bin/cat "$bootstrap_result"
          test "$bootstrap_status" = 0
          lease_id="$(python3 -B -c 'import json, re, sys; result = json.load(open(sys.argv[1])); lease = result.get("lease_id", ""); assert result.get("schema") == "codex.macos-ci-fixture-bootstrap.v1" and result.get("status") == "installed" and result.get("mode") == "ephemeral-bootstrap" and re.fullmatch("[0-9a-f]{32}", lease); print(lease)' "$bootstrap_result")"
          printf 'CODEX_CI_VM_LEASE_ID=%s\n' "$lease_id" >> "$GITHUB_ENV"
      - name: Run deterministic supervisor from read-only install
        run: |
          set -eo pipefail
          commit="$GITHUB_SHA"
          tree="$(git --no-replace-objects rev-parse --verify 'HEAD^{tree}')"
          lease_id="${CODEX_CI_VM_LEASE_ID:-}"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]] \
            || [[ ! "$tree" =~ ^[0-9a-f]{40}$ ]] \
            || [[ ! "$lease_id" =~ ^[0-9a-f]{32}$ ]]; then
            echo '::error::Invalid fixture commit, tree, or disposable lease'
            exit 1
          fi
          fixture_result="$(mktemp "$RUNNER_TEMP/codex-fixture-result.XXXXXX")"
          trap '/bin/rm -f "$fixture_result"' EXIT
          fixture_status=0
          printf '{"version":1,"commit":"%s","tree":"%s","lease_id":"%s"}\n' \
            "$commit" "$tree" "$lease_id" \
            | /usr/bin/sudo -n /usr/local/libexec/codex-macos-ci-readonly-fixture \
            | /usr/bin/tee "$fixture_result" > /dev/null || fixture_status=$?
          /bin/cat "$fixture_result"
          test "$fixture_status" = 0
          python3 -B -c 'import json, sys; result = json.load(open(sys.argv[1])); assert result.get("schema") == "codex.macos-ci-readonly-fixture.v1" and result.get("status") == "complete" and result.get("exit_code") == 0 and result.get("process_group_closed") is True and result.get("output_truncated") is False' "$fixture_result"
      - name: Require source-only Python tree
        if: always()
        run: |
          bytecode_artifact=""
          if ! bytecode_artifact="$(/usr/bin/find . \
            \( -name __pycache__ -o -name '*.pyc' -o -name '*.pyo' \) \
            -print -quit)"; then
            echo "::error::Unable to inspect the checkout for Python bytecode artifacts"
            exit 1
          fi
          if [[ -n "$bytecode_artifact" ]]; then
            echo "::error::Python bytecode artifact: $bytecode_artifact"
            exit 1
          fi

  python-39-compatibility:
    needs: classify_changes
    if: ${{ always() && !cancelled() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.runtime_matrix_required != 'false') }}
    # ubuntu-slim supports private repositories and caps jobs at 15 minutes.
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_LINUX_RUNNER_LABELS || '["ubuntu-slim"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Check supported runtime syntax without bytecode
        run: |
          python3 -B -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]' \
            scripts/codex_personal_sync.py \
            scripts/build_personal_codex_package.py \
            scripts/validate_sync_manifest_changes.py
      - name: Run Python 3.9 compatibility regressions
        run: |
          python3 -m unittest \
            tests.test_personal_sync_reconciliation_safety.PendingLinkTransactionSafetyTests.test_empty_record_empty_state_transaction_parses_and_recovers \
            tests.test_personal_sync_reconciliation_safety.PendingLinkTransactionSafetyTests.test_oversized_json_integer_is_normalized_to_sync_error \
            tests.test_package_builder_safety.PackageBuilderSafetyTests.test_manifest_parser_reports_deep_json_as_package_error \
            tests.test_package_builder_safety.PackageBuilderSafetyTests.test_manifest_parser_reports_oversized_integer_as_package_error \
            tests.test_release_manifest_baseline.ReleaseManifestBaselineTests.test_release_baseline_accepts_verified_release_history \
            tests.test_sync_manifest_changes.SyncManifestChangeTests.test_manifest_transition_counts_same_target_change_once \
            tests.test_sync_manifest_changes.ManifestSerializationSafetyTests.test_deep_raw_json_is_reported_as_validation_error \
            tests.test_sync_manifest_changes.ManifestSerializationSafetyTests.test_oversized_integer_is_reported_as_validation_error
      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  test:
    name: test
    if: ${{ always() }}
    needs:
      - classify_changes
      - source_admission_tests
      - python-39-compatibility
      - independent_supervisor_tests
      - readonly_install_supervisor_tests
      - review_syntax_tests
      - review_tests
      - review_macos_shard_tests
      - review_macos_native_tests
      - project_journal_tests
      - linux_isolation_tests
      - private_overlay_tests
      - private_overlay_uninstall_shard_tests
      - private_overlay_contract_tests
    # ubuntu-slim supports private repositories and caps jobs at 15 minutes.
    runs-on: ${{ fromJSON(vars.CODEX_PRIVATE_LINUX_RUNNER_LABELS || '["ubuntu-slim"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require every CI leaf to pass
        env:
          CODEX_CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/validate_private_ci_results.py
