              || [[ "$current_runtime_loader_binding" != "$runtime_loader_binding" ]] \
              || [[ "$current_runtime_symlink_binding" != "$runtime_symlink_binding" ]] \
              || [[ "$current_runtime_tree_binding" != "$runtime_tree_binding" ]] \
              || [[ "$current_runtime_identity" != "$runtime_identity" ]] \
              || [[ -n "$current_runtime_special" ]] \
              || [[ -n "$current_runtime_hardlink" ]] \
