name: Set up private CI Python
description: Use setup-python on hosted runners and a verified per-job uv-managed interpreter on self-hosted runners.
inputs:
  python-version:
    description: Requested Python major/minor version, including 3.x.
    required: true
runs:
  using: composite
  steps:
    - name: Set up hosted Python
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Prepare isolated self-hosted Python root
      if: ${{ runner.environment == 'self-hosted' }}
      id: python-root
      shell: bash
      env:
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail
        if [[ -z "${RUNNER_TEMP:-}" || -z "${GITHUB_OUTPUT:-}" ]]; then
          echo "::error::Required GitHub runner paths are unavailable"
          exit 1
        fi

        python_root="$(mktemp -d "${RUNNER_TEMP%/}/codex-private-python.XXXXXX")"
        chmod 700 "$python_root"
        printf 'root=%s\n' "$python_root" >> "$GITHUB_OUTPUT"
    - name: Download verified uv and install managed Python
      if: ${{ runner.environment == 'self-hosted' }}
      shell: bash
      env:
        REQUESTED_PYTHON_VERSION: ${{ inputs.python-version }}
        PRIVATE_PYTHON_ROOT: ${{ steps.python-root.outputs.root }}
      run: |
        set -euo pipefail
        if [[ "$REQUESTED_PYTHON_VERSION" == "3.x" ]]; then
          uv_python_version="3"
        elif [[ "$REQUESTED_PYTHON_VERSION" =~ ^3\.[0-9]+$ ]]; then
          uv_python_version="$REQUESTED_PYTHON_VERSION"
        else
          echo "::error::Unsupported requested Python version: $REQUESTED_PYTHON_VERSION"
          exit 1
        fi

        if [[ -z "$PRIVATE_PYTHON_ROOT" || ! -d "$PRIVATE_PYTHON_ROOT" || -z "${GITHUB_PATH:-}" ]]; then
          echo "::error::Required GitHub runner paths are unavailable"
          exit 1
        fi

        case "${RUNNER_OS:-}:${RUNNER_ARCH:-}" in
          Linux:X64)
            uv_archive="uv-x86_64-unknown-linux-gnu.tar.gz"
            uv_archive_size="24198195"
            uv_member="uv-x86_64-unknown-linux-gnu/uv"
            uv_sha256="588f3e360f69ce02b6982aa99f2240e803933a6b7e176ac01617830adf955add"
            checksum_command=(sha256sum)
            ;;
          macOS:ARM64)
            uv_archive="uv-aarch64-apple-darwin.tar.gz"
            uv_archive_size="20688438"
            uv_member="uv-aarch64-apple-darwin/uv"
            uv_sha256="1a7adf8dadae3b55853115d13a8bf564d219597ad13824b93b213706933863e5"
            checksum_command=(shasum -a 256)
            ;;
          *)
            echo "::error::Unsupported runner platform: ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"
            exit 1
            ;;
        esac

        uv_archive_path="$PRIVATE_PYTHON_ROOT/$uv_archive"
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 --max-filesize 134217728 --proto '=https' --proto-redir '=https' \
          "https://github.com/astral-sh/uv/releases/download/0.11.18/$uv_archive" \
          --output "$uv_archive_path"
        actual_uv_size="$(wc -c < "$uv_archive_path" | tr -d '[:space:]')"
        if [[ "$actual_uv_size" != "$uv_archive_size" ]]; then
          echo "::error::Downloaded uv 0.11.18 archive size mismatch"
          exit 1
        fi
        actual_uv_sha256="$("${checksum_command[@]}" "$uv_archive_path" | cut -d ' ' -f 1)"
        if [[ "$actual_uv_sha256" != "$uv_sha256" ]]; then
          echo "::error::Downloaded uv 0.11.18 archive checksum mismatch"
          exit 1
        fi

        tar -xzf "$uv_archive_path" -C "$PRIVATE_PYTHON_ROOT" "$uv_member"
        uv_executable="$PRIVATE_PYTHON_ROOT/$uv_member"
        if [[ ! -x "$uv_executable" ]]; then
          echo "::error::Verified uv archive did not contain an executable uv"
          exit 1
        fi
        uv_version_output="$("$uv_executable" --no-config --version)"
        if [[ "$uv_version_output" != uv\ 0.11.18* ]]; then
          echo "::error::Unexpected uv version: $uv_version_output"
          exit 1
        fi

        export UV_PYTHON_INSTALL_DIR="$PRIVATE_PYTHON_ROOT/codex-uv-python"
        export UV_CACHE_DIR="$PRIVATE_PYTHON_ROOT/codex-uv-cache"
        mkdir -p "$UV_PYTHON_INSTALL_DIR" "$UV_CACHE_DIR"
        "$uv_executable" --no-config python install --install-dir "$UV_PYTHON_INSTALL_DIR" --no-bin "$uv_python_version"
        managed_python="$("$uv_executable" --no-config python find --managed-python "$uv_python_version")"

        python_env="$PRIVATE_PYTHON_ROOT/venv"
        "$uv_executable" --no-config venv --no-project --python "$managed_python" --seed "$python_env"
        env -i "$python_env/bin/python3" -I -S -c \
          'import sys; expected = tuple(map(int, sys.argv[1].split("."))); actual = tuple(sys.version_info[:len(expected)]); sys.exit(f"expected Python {sys.argv[1]}, got {sys.version.split()[0]}") if actual != expected else print(f"empty-environment Python smoke test passed: {sys.version.split()[0]}")' \
          "$uv_python_version"
        printf '%s\n' "$python_env/bin" >> "$GITHUB_PATH"
    - name: Reject unsupported runner environment
      if: ${{ runner.environment != 'github-hosted' && runner.environment != 'self-hosted' }}
      shell: bash
      env:
        CODEX_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        echo "::error::Unsupported runner environment: $CODEX_RUNNER_ENVIRONMENT"
        exit 1
