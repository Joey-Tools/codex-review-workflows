name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  platform_tests:
    name: platform-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1; python_version < "3.11"'
      - name: Install Linux isolation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap gcc ripgrep socat
      - name: Enable unprivileged user namespaces for Linux isolation test
        if: runner.os == 'Linux'
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Compile Python helpers
        run: |
          python3 -m py_compile skills/review-orchestration-playbook/scripts/isolated_review skills/review-orchestration-playbook/scripts/review_runtime/*.py
      - name: Check Linux launcher C syntax
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -fsyntax-only skills/review-orchestration-playbook/scripts/review_runtime/claude_linux_launcher.c
      - name: Run tests
        run: |
          python3 -m unittest discover -s skills/review-orchestration-playbook/tests -p 'test_*.py' -v
      - name: Run real Linux isolation integration test
        if: runner.os == 'Linux'
        env:
          CODEX_REVIEW_RUN_LINUX_ISOLATION_INTEGRATION: "1"
        run: |
          python3 -m unittest -v skills/review-orchestration-playbook/tests/test_claude_linux.py

  broker_reproducibility:
    name: broker-reproducibility (macos-26)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Report hosted-runner toolchain identity
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          set -euo pipefail
          toolchain_root="$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          /usr/bin/xcodebuild -version
          /usr/bin/xcrun --sdk macosx --show-sdk-version
          /usr/bin/xcrun --sdk macosx --show-sdk-build-version
          /usr/bin/shasum -a 256 \
            "$toolchain_root/clang" \
            "$toolchain_root/ld" \
            "$toolchain_root/lipo" \
            "$toolchain_root/vtool" \
            "$toolchain_root/codesign_allocate" \
            /usr/bin/codesign
      - name: Require hosted-runner byte reproduction
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          /bin/bash \
            skills/review-orchestration-playbook/scripts/build_claude_keychain_broker_macos.sh \
            --check

  independent_supervisor_tests:
    name: independent-supervisor (python-3.13)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile independent review supervisor
        working-directory: skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        run: |
          python3 -m compileall -q review_supervisor independent-codex-pr-review
      - name: Run independent review supervisor tests
        working-directory: skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify independent review supervisor CLI
        working-directory: skills/review-orchestration-playbook/scripts/independent_codex_pr_review
        run: |
          python3 independent-codex-pr-review --help

  test:
    name: test
    if: ${{ always() }}
    needs:
      - platform_tests
      - broker_reproducibility
      - independent_supervisor_tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform test to pass
        env:
          PLATFORM_TESTS_RESULT: ${{ needs.platform_tests.result }}
          BROKER_REPRODUCIBILITY_RESULT: ${{ needs.broker_reproducibility.result }}
          INDEPENDENT_SUPERVISOR_RESULT: ${{ needs.independent_supervisor_tests.result }}
        run: |
          test "$PLATFORM_TESTS_RESULT" = "success"
          test "$BROKER_REPRODUCIBILITY_RESULT" = "success"
          test "$INDEPENDENT_SUPERVISOR_RESULT" = "success"
