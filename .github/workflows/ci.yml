name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python helpers
        run: |
          python3 -m py_compile skills/review-orchestration-playbook/scripts/isolated_review skills/review-orchestration-playbook/scripts/git_readonly_shim skills/review-orchestration-playbook/scripts/review_runtime/*.py
      - name: Run tests
        run: |
          python3 -m unittest discover -s skills/review-orchestration-playbook/tests -p 'test_*.py' -v
